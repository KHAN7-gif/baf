const $=s=>document.querySelector(s);
const esc=s=>(s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const team=id=>T.teams.find(t=>t.id===id);
const tIndex=id=>T.teams.findIndex(t=>t.id===id);
const tName=t=>t&&t.name&&t.name.trim()?t.name:('Pasukan '+(tIndex(t?t.id:'')+1));
const tShort=t=>{ if(!t)return '?'; if(t.short&&t.short.trim())return t.short.toUpperCase().slice(0,5); const n=t.name&&t.name.trim()?t.name:''; return n?n.replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase()||('P'+(tIndex(t.id)+1)):('P'+(tIndex(t.id)+1)); };
function imgSrc(url){ if(!url)return ''; url=url.trim();
  const m=url.match(/\/file\/d\/([-\w]{10,})/)||url.match(/[?&]id=([-\w]{10,})/)||url.match(/\/d\/([-\w]{10,})/);
  return m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400'):url; }
function ytId(url){ if(!url)return ''; url=url.trim();
  const m=url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:''; }
function ytThumb(url){ const id=ytId(url); return id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':''; }

const AUTO_AW={bk1:'champ',bk2:'runner',bk3:'third',bk4:'fourth'};

}
function teamAwards(tid){ const out=[];  ['tarian','battle'].forEach(c=>['placement','special'].forEach(g=>AWARDS[c][g].forEach(it=>{ const w=awardWinner(it[0]); if(w&&w.id===tid)out.push({name:it[1],prize:prizeOf(it[0],it[2]),comp:AWARDS[c].title}); })));
  return out; }

function matchCard(m,mini){
  const tp=team(m.top),bp=team(m.bot);

}

function obsBracketChartHTML(){

  if(TP)h+=`<div class="obsc-h" style="margin-top:16px">🥉 ${KOLABEL.TP}</div><div class="obsc-bronze">${obscBox(TP)}</div>`;
  h+=`</div>`;
  pre.slice().reverse().forEach(r=>{ const idx=pre.indexOf(r); const [,R]=half(T.ko.filter(m=>m.round===r));
    let inner;
    if(idx===0){ let b=1; inner=R.map((m,i)=>obscBox(m, m.top==='BYE'?'':'B'+(b++), m.bot==='BYE'?'':'B'+(b++), bp.includes(Math.floor(i/4)+3))).join(''); }

function layoutObsBracket(root){
  const box=root.querySelector('.obsc-box'); if(!box)return;
  const bh=box.getBoundingClientRect().height, g=14, U=bh+g;
  let maxRi=0;
  root.querySelectorAll('.obsc-col[data-ri]').forEach(col=>{
    const ri=+col.dataset.ri, mult=Math.pow(2,ri); maxRi=Math.max(maxRi,ri);
    const boxes=[...col.querySelectorAll('.obsc-box')];
    boxes.forEach(b=>b.style.marginBottom=(mult*U-bh)+'px');
    if(boxes[0])boxes[0].style.marginTop=((mult-1)*U/2)+'px';
  });
  const fin=root.querySelector('.obsc-final'); if(fin)fin.style.marginTop=((Math.pow(2,maxRi)-1)*U/2)+'px';
}

    }

    function close(){
      panel.classList.remove('open');
      back.classList.remove('open');
      trigger.setAttribute('aria-expanded','false');
      document.body.style.overflow='';
    }

    function open(){
      render();
      panel.classList.add('open');
      back.classList.add('open');
      trigger.setAttribute('aria-expanded','true');
      document.body.style.overflow='hidden';
    }

    function render(){
      const admin=isAdmin();
      const data=admin?ADMIN:USER;
      panel.querySelector('.baf-menu-role').textContent=admin?'ADMIN':'USER';
      const list=panel.querySelector('.baf-menu-list');
      list.innerHTML='<div class="baf-menu-section">NAVIGASI</div>';

      data.forEach(([key,label])=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='baf-menu-item';
        b.dataset.key=key;
        b.innerHTML=I[key]+'<span>'+label+'</span>';
        b.addEventListener('click',()=>{
          if(key==='about') clickAbout();
          else{
            const o=original(key);
            if(o) o.click();
          }
          close();
        });
        list.appendChild(b);
      });

      /* ADMIN: semua menu pengurusan mesti boleh dicapai dari hamburger */
      if(admin){
        const sec=document.createElement('div');
        sec.className='baf-menu-section baf-admin-section';
        sec.textContent='PENTADBIRAN';
        list.appendChild(sec);

        const adminIcons={
          adminTeams:I.teams,
          adminDance:I.dance,
          adminVoting:I.vote,
          adminResults:I.results,
          adminDraw:I.draw,
          adminAwards:I.awards,
          adminSettings:I.settings
        };

        ADMIN_TOOLS.forEach(([key,label,secName])=>{
          const b=document.createElement('button');
          b.type='button';
          b.className='baf-menu-item admin-tool';
          b.dataset.adminsec=secName;
          b.innerHTML=adminIcons[key]+'<span>'+label+'</span>';
          b.addEventListener('click',()=>{
            /* Buka tab ADMIN, pilih fungsi yang diminta */
            const adminTab=original('admin');
            if(adminTab) adminTab.click();
            else if(typeof switchTab==='function') switchTab('admin');

            if(typeof adSec!=='undefined') adSec=secName;
            if(typeof renderAdmin==='function') renderAdmin();
            close();
          });
          list.appendChild(b);
        });
      }

      const auth=panel.querySelector('.baf-menu-auth');
      auth.innerHTML='';
      const b=document.createElement('button');
      b.type='button';
      b.className='baf-menu-item '+(admin?'logout':'');
      b.innerHTML=I[admin?'logout':'login']+'<span>'+(admin?'LOG OUT':'LOG IN')+'</span>';
      b.addEventListener('click',()=>{clickAuth(admin);close();});
      auth.appendChild(b);

      sync();
    }

    function sync(){
      panel.querySelectorAll('.baf-menu-item[data-key]').forEach(b=>{
        const o=original(b.dataset.key);
        b.classList.toggle('active',!!o && (
          o.classList.contains('active') ||
          o.getAttribute('aria-selected')==='true'
        ));
      });
    }

    trigger.addEventListener('click',open);
    back.addEventListener('click',close);
    panel.querySelector('.baf-menu-close').addEventListener('click',close);
    window.__bafMenuRefresh=render;
  }

  function boot(){
    if(innerWidth<=600) build();
    setTimeout(()=>window.__bafMenuRefresh&&window.__bafMenuRefresh(),300);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
  window.addEventListener('resize',boot);
})();
</script>

    <div class="pwa-head"><span class="pwa-t" id="pwaGuideTitle">Cara Pasang</span><button class="pwa-x" data-pwa-gclose>✕</button></div>
    <div class="pwa-steps" id="pwaGuideSteps"></div>
    <button class="pwa-btn gold" data-pwa-gclose>TUTUP</button>
  </div>
</div>

<script>
(function(){
  const KEY='baf_pwa_dismissed_v1';
  const g=(id)=>document.getElementById(id);
  const isStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true; }catch(e){ return navigator.standalone===true; } };
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent||'') || (/(Mac)/i.test(navigator.userAgent||'') && 'ontouchend' in document);
  const isAndroid=()=>/android/i.test(navigator.userAgent||'');
  const dismissed=()=>{ try{ return localStorage.getItem(KEY)==='1'; }catch(e){ return false; } };
  const setDismissed=()=>{ try{ localStorage.setItem(KEY,'1'); }catch(e){} };
  const utility=()=>/overlay=|juri=/.test(location.search||'');
  let deferred=null;

  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferred=e; });
  window.addEventListener('appinstalled',()=>{ setDismissed(); show('pwaInstall',false); show('pwaGuide',false); });

  function show(id,on){ const el=g(id); if(!el)return;
    if(on){ el.style.display='flex'; requestAnimationFrame(()=>el.classList.add('show')); }
    else { el.classList.remove('show'); setTimeout(()=>{ if(!el.classList.contains('show'))el.style.display='none'; },260); } }

  const IC={
    share:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>',
    plus:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    menu:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
  };
  function buildGuide(){
    const t=g('pwaGuideTitle'), box=g('pwaGuideSteps'); let steps;
    if(isIOS()){ t.textContent='Cara Pasang di iPhone / iPad';
      steps=[[IC.share,'Tekan butang <b>Share</b> di bahagian bawah (Safari)'],[IC.plus,'Pilih <b>"Add to Home Screen"</b>'],['<span class="badge">Add</span>','Tekan <b>"Add"</b> di bahagian atas kanan']];
    } else if(isAndroid()){ t.textContent='Cara Pasang di Android';
      steps=[[IC.menu,'Buka menu browser (⋮)'],[IC.plus,'Pilih <b>Install app / Add to Home screen</b>'],['<span class="badge">Install</span>','Tekan <b>Install / Add</b>']];
    } else { t.textContent='Cara Pasang di Desktop';
      steps=[[IC.plus,'Cari ikon <b>Install</b> pada bar alamat browser'],['<span class="badge">Install</span>','Klik <b>Install</b>'],[IC.menu,'Atau menu browser → <b>Install app</b>']];
    }
    box.innerHTML=steps.map((s,i)=>'<div class="pwa-step"><span class="pwa-n">'+(i+1)+'</span><span class="pwa-si">'+s[0]+'</span><span class="pwa-sx">'+s[1]+'</span></div>').join('');
  }
  function onAdd(){
    if(deferred){ deferred.prompt(); deferred.userChoice.finally(()=>{ deferred=null; setDismissed(); show('pwaInstall',false); }); }
    else { show('pwaInstall',false); buildGuide(); show('pwaGuide',true); }
  }
  function later(){ setDismissed(); show('pwaInstall',false); }
  document.querySelectorAll('[data-pwa-add]').forEach(b=>b.onclick=onAdd);
  document.querySelectorAll('[data-pwa-later]').forEach(b=>b.onclick=later);
  document.querySelectorAll('[data-pwa-gclose]').forEach(b=>b.onclick=()=>show('pwaGuide',false));
  g('pwaGuide').addEventListener('click',(e)=>{ if(e.target===g('pwaGuide'))show('pwaGuide',false); });

  function maybeShow(){ if(isStandalone()||dismissed()||utility())return;
    setTimeout(()=>{ if(!isStandalone()&&!dismissed())show('pwaInstall',true); }, 2800); }
  if(document.readyState==='complete')maybeShow(); else window.addEventListener('load',maybeShow);

  if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js?v=2').catch(function(){}); }); }
})();
</script>
