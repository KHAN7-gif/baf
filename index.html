<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9A24A">
<title>Battle Zapin — Kejohanan Kalah Mati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* BORNEO ARTS 2026 — HARTA PUSAKA */
    --ink:#F7F1E3; --panel:#FFFDF8; --panel-2:#F2E8D2; --raise:#FFFFFF;
    --line:rgba(92,66,28,.14); --line-2:rgba(92,66,28,.24);
    --txt:#211A12; --muted:#85765E;
    --mint:#C79A3B; --mint-soft:rgba(199,154,59,.12); --cn:rgba(92,66,28,.18);
    --amber:#D6AD54; --rose:#9B6A1C; --rose-soft:rgba(155,106,28,.10); --gold:#D4AF37;
    --gold-deep:#9B7425; --gold-light:#F0D58A; --heritage:#6B4B1F;
    --display:'Oswald',system-ui,sans-serif;
    --body:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--body);background:var(--ink);color:var(--txt);min-height:100vh;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 380px at 50% -120px,rgba(230,0,126,.10),transparent 70%),
      radial-gradient(700px 320px at 100% -60px,rgba(230,0,126,.06),transparent 70%)}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 14px 90px}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px;max-width:960px;margin:0 auto;
    background:linear-gradient(180deg,rgba(246,245,248,.94),rgba(246,245,248,.60));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .crest{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(145deg,#fff,#f2ecf1);border:1px solid var(--line-2);
    box-shadow:0 0 0 1px rgba(230,0,126,.20),0 8px 22px rgba(24,16,32,.10)}
  .tname{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tsub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
  .admin-btn{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:600;font-size:12.5px;
    color:var(--txt);background:var(--raise);border:1px solid var(--line-2);padding:9px 13px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:.18s;display:inline-flex;align-items:center;gap:6px}
  .admin-btn:hover{border-color:var(--mint);color:var(--mint)}
  .admin-btn.live{background:var(--mint);color:#fff;border-color:var(--mint)}
  .btn-ic{width:16px;height:16px;flex:none;display:block}

  .tabs{position:sticky;top:66px;z-index:25;display:flex;gap:6px;padding:8px;margin:0 auto 16px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:16px;max-width:960px}
  .tabs button{flex:1;font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-size:12.5px;
    color:var(--muted);background:transparent;border:0;padding:11px 4px;border-radius:11px;cursor:pointer;transition:.18s}
  .tabs button.active{background:#171918;color:var(--mint);box-shadow:0 2px 8px rgba(24,16,32,.08),inset 0 0 0 1px var(--line-2)}
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .subtab{font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;font-weight:700;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s}
  .subtab.on{background:var(--mint);color:#fff;border-color:var(--mint)}
  .subtab.sub2{font-size:11px;padding:8px 12px}
  .sub2row{margin-top:-6px}
  .hdr-right{display:flex;gap:8px;align-items:center;flex:none}
  .about-btn{background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
  .about-btn.live{background:var(--mint);color:#fff;box-shadow:none}
  .cd-card{background:linear-gradient(135deg,var(--mint),#b3005f);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;text-align:center;box-shadow:0 8px 24px rgba(230,0,126,.25)}
  .cd-lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:700;opacity:.95;margin-bottom:8px}
  .cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cd-cell{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 4px}
  .cd-v{font-family:var(--mono);font-weight:800;font-size:26px;line-height:1}
  .cd-u{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;opacity:.9;margin-top:3px}
  .cd-card.live{background:linear-gradient(135deg,#22B36B,#158048)}
  .ab-name{font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;font-weight:700;font-size:20px;margin-bottom:10px}
  .ab-row{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .ab-row span{font-size:16px}
  .ab-desc{font-size:14px;color:var(--muted);line-height:1.5;margin:10px 0 4px}
  .ab-qr{width:200px;height:200px;border-radius:12px;box-shadow:0 4px 16px rgba(24,16,32,.12);background:#171918}
  .ab-qrhint{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
  .ab-link{font-family:var(--mono);font-size:11.5px;color:var(--mint);word-break:break-all}

  /* competition header */
  .comp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:600}
  .pill b{font-family:var(--display);letter-spacing:.5px;text-transform:uppercase;font-size:12px}
  .pill .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .pill.go{border-color:rgba(230,0,126,.35)}
  .pill.go b{color:var(--mint)}

  /* league table */
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.04)}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  .ghead h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:1.2px;text-transform:uppercase}
  .ghead .cols{display:flex;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
  .ghead .cols span{width:26px;text-align:center}
  .ghead .cols .pts{color:var(--txt)}
  .srow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-left:3px solid transparent}
  .srow + .srow{border-top:1px solid var(--line)}
  .srow[data-z="q"]{border-left-color:var(--mint)}
  .srow .pos{font-family:var(--mono);font-weight:800;font-size:13px;width:16px;text-align:center;color:var(--muted)}
  .srow[data-z="q"] .pos{color:var(--mint)}
  .srow .tn{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .tn .sub2{color:var(--muted);font-family:var(--mono);font-weight:700;font-size:11px}
  .srow .stt{display:flex;font-family:var(--mono);font-size:13px;font-weight:500}
  .srow .stt span{width:26px;text-align:center;color:var(--muted)}
  .srow .stt .gd{color:var(--txt)}
  .srow .stt .pts{color:var(--txt);font-weight:800}
  .srow[data-z="q"] .stt .pts{color:var(--mint)}

  .bdg{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-family:var(--mono);font-weight:800;font-size:9px;color:#fff;letter-spacing:.2px;
    background:var(--c,#333);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
  .bdg.img{background-size:cover;background-position:center;color:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
  .flag{width:18px;height:13px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line);vertical-align:middle;margin-right:6px}
  .sub2 .flag{width:14px;height:10px;margin:0 4px 0 0}
  .tlogo{display:inline-block;width:14px;height:14px;border-radius:50%;background-size:cover;background-position:center;vertical-align:middle;margin-right:4px;box-shadow:0 0 0 1px var(--line)}
  .mini{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--c,#555);background-size:cover;background-position:center;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .mini.img{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .duel .dn{display:flex;align-items:center;gap:6px}
  .duel .dn.a{justify-content:flex-end}
  .prev{display:flex;align-items:center;gap:9px;margin:6px 0 12px}
  .pl-row2{display:grid;grid-template-columns:22px 1fr 38px;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
  .pl-row2:last-child{border-bottom:0}
  .pl-row2 .pn{font-family:var(--mono);color:var(--muted);font-size:12px;text-align:center;padding-top:11px}
  .pl-row2 .stk{display:flex;flex-direction:column;gap:6px}
  .pl-row2 input{padding:9px 11px}
  .pl-row2 input[data-pp]{font-size:12px;color:var(--muted)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .adm-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
  .adm-col{display:flex;flex-direction:column;gap:7px}
  .adm-grp{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:11px;color:var(--mint);margin:0 2px 3px}
  .adm-col .chips{display:flex;flex-direction:column;gap:7px;margin:0}
  .adm-col .chip{width:100%;text-align:center}
  @media(max-width:640px){ .adm-groups{grid-template-columns:1fr;gap:12px} .adm-col .chips{flex-direction:row;flex-wrap:wrap} .adm-col .chip{width:auto} }
  .dw-side-h{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:11px;color:var(--mint);margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--line)}
  .dw-side-h:first-of-type{border-top:0;padding-top:0}
  .sd-seeds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .sd-turn{font-size:13px;font-weight:600;margin:8px 0;padding:9px 12px;background:rgba(230,0,126,.1);border-radius:10px}
  .sd-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .sd-plot{border:2px solid var(--line-2);border-radius:12px;padding:12px;text-align:center;background:var(--panel-2);min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .sd-plot.filled{border-color:#22B36B;background:rgba(34,179,107,.09)}
  .sd-plot.blink{animation:sdblink .9s ease-in-out infinite}
  @keyframes sdblink{0%,100%{border-color:var(--mint);background:rgba(230,0,126,.20);box-shadow:0 0 0 0 rgba(230,0,126,.55)}50%{border-color:rgba(230,0,126,.35);background:rgba(230,0,126,.02);box-shadow:0 0 0 9px rgba(230,0,126,0)}}
  .sd-here{font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;font-size:12px;font-weight:700;color:var(--mint)}
  .sd-pn{font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;font-size:11px;font-weight:700;color:var(--muted)}
  .sd-seedtag{font-size:12px;font-weight:600;line-height:1.35}
  .sd-empty{font-size:12px;color:var(--muted)}
  .chip{font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-size:12px;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:10px;cursor:pointer;transition:.16s}
  .chip.active{background:#171918;color:var(--mint);border-color:rgba(230,0,126,.45);box-shadow:0 1px 5px rgba(24,16,32,.06)}
  .empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}

  /* home dashboard */
  .home-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .hstat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(24,16,32,.04)}
  .hstat .k{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .hstat b{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--txt)}
  .lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .lead-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.04)}
  .lead-card .lc-h{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:600;color:var(--mint);margin-bottom:10px}
  .lead-card .lc-b{display:flex;align-items:center;gap:10px;min-width:0}
  .lead-card .lc-n{min-width:0;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead-card .lc-n span{display:block;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .home-sec-t{font-family:var(--display);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;font-weight:600;color:var(--txt);margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
  @media(max-width:440px){.home-hero{grid-template-columns:repeat(2,1fr)}.lead-grid{grid-template-columns:1fr}}

  /* fixtures */
  .fx-group{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 9px}
  .fx-group:first-of-type{margin-top:8px}
  .fx-gk{font-family:var(--display);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;font-weight:600;color:var(--txt)}
  .fx-gn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}

  /* big match cards (Perlawanan) */
  .mc-chips{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mc-chips::-webkit-scrollbar{display:none}
  .mc-chips .chip{flex:none}
  .mcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 12px 13px;margin-bottom:13px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.05)}
  .mc-status{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:8px;padding:4px 13px;white-space:nowrap}
  .mc-status.ft{background:var(--mint)}
  .mc-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .mc-team{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .mc-logo{position:relative;width:62px;height:62px;border-radius:50%;background:var(--panel-2);box-shadow:0 0 0 1px var(--line)}
  .mc-img{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center}
  .mc-init{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;letter-spacing:.5px}
  .mc-flag{position:absolute;right:-3px;bottom:-3px;width:24px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 2px var(--panel)}
  .mc-name{font-weight:700;font-size:13px;text-align:center;line-height:1.2;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mc-team.w .mc-name{color:var(--mint)}
  .mc-sidebar{height:5px;width:46px;border-radius:3px;background:transparent}
  .mc-team.red .mc-sidebar{background:#E23B3B}
  .mc-team.green .mc-sidebar{background:#22B36B}
  .mc-team.red .mc-logo{box-shadow:0 0 0 3px #E23B3B}
  .mc-team.green .mc-logo{box-shadow:0 0 0 3px #22B36B}
  .mc-score{display:flex;align-items:center;gap:9px;padding:0 4px}
  .mc-n{font-family:var(--mono);font-weight:800;font-size:34px;color:var(--muted);line-height:1}
  .mc-n.win{color:var(--mint)}
  .mc-col{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--line-2)}
  .mc-vs{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:2px}
  .mc-pen{text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mint);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  @media(max-width:360px){.mc-logo{width:52px;height:52px}.mc-n{font-size:28px}.mc-name{font-size:12px}}
  .mcard.tapp{cursor:pointer;transition:.14s;-webkit-tap-highlight-color:transparent}
  .mcard.tapp:hover{border-color:var(--mint);box-shadow:0 1px 3px rgba(24,16,32,.05),0 12px 30px rgba(230,0,126,.12)}
  .mcard.tapp:active{transform:scale(.99)}
  .mc-tap{text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:9px;font-weight:600;color:var(--mint);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .mc-no{position:absolute;top:9px;left:11px;font-family:var(--mono);font-weight:800;font-size:10px;color:var(--muted);letter-spacing:.5px}
  .km-no{position:absolute;top:-13px;left:2px;font-family:var(--mono);font-weight:800;font-size:9px;color:var(--muted);letter-spacing:.4px;z-index:2}
  .kteam .kpn{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--muted)}
  .kteam.win .kpn{color:var(--mint)}
  .obsc-ft b{color:var(--mint)}
  @keyframes obsPulse{0%,100%{box-shadow:0 2px 10px rgba(24,16,32,.06);border-color:var(--mint)}50%{box-shadow:0 0 0 3px rgba(230,0,126,.30),0 0 22px rgba(230,0,126,.45);border-color:var(--mint)}}
  @keyframes obsBlink{0%,49%{opacity:1}50%,100%{opacity:.15}}
  .obsc-box.live{border-color:var(--mint);animation:obsPulse 1.05s ease-in-out infinite}
  .obsc-box.sblink{border:2px solid var(--mint);animation:obsBlink .8s ease-in-out infinite}
  @keyframes obsBlink{0%,100%{background:rgba(230,0,126,.22);box-shadow:0 0 0 3px rgba(230,0,126,.45)}50%{background:var(--panel);box-shadow:0 0 0 0 rgba(230,0,126,0)}}
  .obsc-live{color:var(--mint);font-weight:800;letter-spacing:.5px;animation:obsBlink 1.05s step-start infinite}
  .mc-status.live{color:var(--mint)}
  .sm-st.liveon{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
  .sm-st3{flex-wrap:nowrap}
  .sm-st3 .btn{padding:11px 4px;font-size:11.5px;white-space:nowrap}
  .obsc-pen{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--muted)}
  .obsc-team.win .obsc-pen{color:var(--mint)}

  /* score picker modal */
  .sm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sm-row:last-of-type{border-bottom:0}
  .sm-team{display:flex;align-items:center;gap:8px;min-width:110px;flex:1}
  .sm-logo{width:30px;height:30px;border-radius:50%;flex:none;background-size:cover;background-position:center;background-color:var(--panel-2);box-shadow:0 0 0 1px var(--line);overflow:hidden}
  .sm-nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sm-nums{display:flex;gap:6px;margin-left:auto}

  /* OBS / LED display — classic two-sided bracket */

  .obsc-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 3px rgba(24,16,32,.05)}
  .obsc-ft{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:3px 8px 0}
  .obsc-team{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;font-family:var(--mono);font-weight:700;font-size:12px;position:relative}

  .obsc-team+.obsc-team{border-top:1px solid var(--line)}
  .obsc-ic{width:17px;height:12px;object-fit:cover;border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line);background:var(--panel-2)}
  .obsc-ic.lg,.obsc-ic.dot{width:14px;height:14px;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 0 0 1px var(--line)}
  .obsc-cd{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;color:var(--txt)}
  .obsc-pen{font-size:10px;color:var(--muted);font-weight:700}
  .obsc-sc{font-weight:800;color:var(--muted);min-width:14px;text-align:right}

  .obsc-team.bye .obsc-cd,.obsc-team.tbd .obsc-cd{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted)}
  .obsc-final .obsc-box{border-color:var(--mint);box-shadow:0 0 0 1px rgba(230,0,126,.25),0 12px 26px rgba(230,0,126,.14)}
  .obsc-champ{text-align:center;font-family:var(--display);font-weight:700;font-size:12px;color:var(--mint);padding:9px 6px 3px;letter-spacing:.3px}
  .obsc-bronze .obsc-box{border-color:var(--line-2)}
  /* connector stubs toward centre */
  .obsc-col.lft .obsc-box::after{content:"";position:absolute;left:100%;top:50%;width:12px;height:2px;background:var(--line-2)}
  .obsc-col.rgt .obsc-box::before{content:"";position:absolute;right:100%;top:50%;width:12px;height:2px;background:var(--line-2)}
  .obsc-col.center .obsc-final .obsc-box::before{content:"";position:absolute;right:100%;top:50%;width:12px;height:2px;background:var(--line-2)}
  .obsc-col.center .obsc-final .obsc-box::after{content:"";position:absolute;left:100%;top:50%;width:12px;height:2px;background:var(--line-2)}
  body.obs-full .topbar,body.obs-full .tabs,body.obs-full #tab-home,body.obs-full #tab-teams,body.obs-full #tab-fixtures,body.obs-full #tab-bracket,body.obs-full #tab-admin{display:none!important}

  .star-btn{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;cursor:pointer;transition:.15s}

  .kpen{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--mint);text-align:center;padding:3px 0 4px;border-top:1px dashed var(--line-2)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.04)}
  .panel h2{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:15px;font-weight:600;margin-bottom:4px}

  input[type=text],input[type=password],input[type=number],select{width:100%;font-family:var(--body);font-size:15px;color:var(--txt);
    background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;-webkit-appearance:none}
  input:focus,select:focus{outline:none;border-color:var(--mint)}
  .row2{display:grid;grid-template-columns:1fr 80px;gap:8px}

  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:600;font-size:13px;
    background:var(--mint);color:#fff;border:0;border-radius:11px;padding:13px 18px;cursor:pointer;width:100%;transition:.16s}
  .btn:hover{filter:brightness(1.07)}

  .btn.sm{width:auto;padding:9px 14px;font-size:12px}
  .btn-row{display:flex;gap:9px;flex-wrap:wrap}

  .pl-row{display:grid;grid-template-columns:24px 1fr 38px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}

  .pl-row input{padding:9px 11px}
  .icon-btn{background:var(--rose-soft);color:var(--rose);border:0;border-radius:9px;height:38px;cursor:pointer;font-size:16px;font-weight:700}
  input[type=color]{width:46px;height:44px;padding:2px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;cursor:pointer}

  .fx-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}

    padding:10px 4px;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;color:var(--txt);
    -webkit-appearance:none;appearance:none;background-image:none}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);

    transition:.25s;box-shadow:0 10px 30px rgba(24,16,32,.22);font-family:var(--display);letter-spacing:.5px;text-transform:uppercase}

  /* ---------- bracket ---------- */
  .ko-nav{margin:2px 2px 16px}

  .ko-lbl{flex:1;background:none;border:0;cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:1.2px;color:var(--muted);padding:2px 0;transition:color .2s}

    font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:color .18s}

const isBye=c=>c==='BYE';
const isReal=c=>c&&c!=='TBD'&&c!=='BYE';

/* ---------- knockout engine ---------- */
const KORDER=['R32','R16','QF','SF','F'];
const KOLABEL={R32:'Kumpulan',R16:'Top 16',QF:'Suku Akhir',SF:'Separuh Akhir',F:'Akhir',TP:'Tempat Ke-3 & 4'};
const KOSHORT={R32:'P1',R16:'T16',QF:'T8',SF:'T4',F:'F'};
const KOCAT={R32:'Kumpulan',R16:'Top 16',QF:'Suku Akhir',SF:'Separuh Akhir',F:'Akhir',TP:'Tempat Ke-3 & 4'};
const KFIRST={32:'R32',16:'R16',8:'QF',4:'SF',2:'F'};
function bracketSize(){ const n=Math.max(2,T.teams.length); let s=2; while(s<n)s*=2; return Math.min(32,s); }
function buildKO(size){
  const start=KFIRST[size], rounds=KORDER.slice(KORDER.indexOf(start)), ko=[];
  rounds.forEach((r,ri)=>{ const n=(size/2)/Math.pow(2,ri);
    for(let i=0;i<n;i++){ const m={id:r+'_'+i,round:r,top:'TBD',bot:'TBD',ts:null,bs:null,pts:null,pbs:null,status:'sched',next:null,slot:null};
      if(ri<rounds.length-1){ m.next=rounds[ri+1]+'_'+Math.floor(i/2); m.slot=i%2?'bot':'top'; } ko.push(m); } });
  return ko;
}
function koWinner(m){
  const tR=isReal(m.top), bR=isReal(m.bot);
  if(m.top==='BYE'&&bR)return 'bot';
  if(m.bot==='BYE'&&tR)return 'top';
  if(m.ts==null||m.bs==null)return null;
  if(m.ts>m.bs)return 'top'; if(m.bs>m.ts)return 'bot';
  if(m.pts!=null&&m.pbs!=null&&m.pts!==m.pbs)return m.pts>m.pbs?'top':'bot';
  return null;
}
function firstRound(){ const rs=koRounds(); return rs[0]; }
function propagateKO(){
  if(!T.ko)return; const by={}; T.ko.forEach(m=>by[m.id]=m);
  const targets=new Set(T.ko.filter(m=>m.next).map(m=>m.next));
  T.ko.forEach(m=>{ if(targets.has(m.id)){ m.top='TBD'; m.bot='TBD'; } });
  T.ko.forEach(m=>{ const w=koWinner(m); if(w&&m.next){ const nm=by[m.next]; if(nm)nm[m.slot]=(w==='top'?m.top:m.bot); } });
  if(T.thirdPlace){
    const tp=by['TP_0'], sfs=T.ko.filter(m=>m.round==='SF');
    if(tp&&sfs.length===2){ sfs.forEach((m,i)=>{ const slot=i===0?'top':'bot', w=koWinner(m); tp[slot]=w?(w==='top'?m.bot:m.top):'TBD'; }); }
  }
  // auto-finalize: bila skor sudah menentukan pemenang antara 2 pasukan sebenar, tandakan Selesai
  T.ko.forEach(m=>{ if(isReal(m.top)&&isReal(m.bot)&&koWinner(m))m.status='ft'; });
}
function koRounds(){ const out=[]; KORDER.forEach(r=>{ if(T.ko&&T.ko.some(m=>m.round===r))out.push(r); }); return out; }
function newBracket(){
  const size=bracketSize(), ko=buildKO(size);
  if(T.thirdPlace&&size>=4)ko.push({id:'TP_0',round:'TP',top:'TBD',bot:'TBD',ts:null,bs:null,pts:null,pbs:null,status:'sched',next:null,slot:null,motm:null});
  T.ko=ko; propagateKO();
}
function drawRandom(){
  const size=bracketSize(); newBracket();
  const fr=firstRound(), frM=T.ko.filter(m=>m.round===fr);
  const ids=T.teams.map(t=>t.id).slice(0,size);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const byes=size-ids.length;
  // distribute byes into distinct matches (spread across halves)
  const byeSlots=new Set(); const step=Math.max(1,Math.floor((size/2)/Math.max(1,byes)));
  for(let b=0,mi=0;b<byes;b++,mi+=step){ byeSlots.add((mi%(size/2))*2+1); }
  const slots=new Array(size).fill(null); let ti=0;
  for(let i=0;i<size;i++){ if(byeSlots.has(i)){ slots[i]='BYE'; continue; } slots[i]=ids[ti++]||'BYE'; }
  frM.forEach((m,k)=>{ m.top=slots[2*k]; m.bot=slots[2*k+1]; });
  propagateKO();
}
function finalStandings(){
  const F=(T.ko||[]).find(m=>m.round==='F');
  let champ=null,runner=null,third=null,fourth=null;
  if(F){ const w=koWinner(F); if(w){ champ=w==='top'?F.top:F.bot; runner=w==='top'?F.bot:F.top; } }
  const TP=(T.ko||[]).find(m=>m.round==='TP');
  if(TP){ const w=koWinner(TP); if(w){ third=w==='top'?TP.top:TP.bot; fourth=w==='top'?TP.bot:TP.top; } }
  return {champ,runner,third,fourth};
}
function teamStatus(id){
  if(!T.ko||!T.ko.length)return {cls:'tbd',label:'Belum diundi'};
  const fs=finalStandings();
  if(fs.champ===id)return {cls:'champ',label:'🏆 Juara'};
  if(fs.runner===id)return {cls:'in',label:'🥈 Naib Juara'};
  if(fs.third===id)return {cls:'in',label:'🥉 Tempat Ke-3'};
  let seen=false,elimRound=null;
  T.ko.forEach(m=>{ if(m.round==='TP')return; if(m.top===id||m.bot===id){ seen=true; const w=koWinner(m); if(w){ const winId=w==='top'?m.top:m.bot; if(winId!==id)elimRound=m.round; } } });
  if(elimRound)return {cls:'out',label:'Tersingkir · '+KOLABEL[elimRound]};
  if(seen)return {cls:'in',label:'Dalam saingan'};
  return {cls:'tbd',label:'Belum diundi'};
}
function koMatches(){ return (T.ko||[]).filter(m=>m.round!=='TP'); }
function matchDone(m){ return m.status==='ft'||koWinner(m)!=null; }
function koNo(m){ if(!m||!T.ko)return ''; let n=0; for(const r of KORDER.concat('TP')){ const arr=T.ko.filter(y=>y.round===r); for(const x of arr){ n++; if(x.id===m.id)return 'M'+n; } } return ''; }

function matchCard(m,mini){
  const tp=team(m.top),bp=team(m.bot);
  const tByeName=m.top==='BYE'?'BYE':(tp?tName(tp):'TBD'), bByeName=m.bot==='BYE'?'BYE':(bp?tName(bp):'TBD');
  const w=koWinner(m), done=matchDone(m);
  const tw=w==='top', bw=w==='bot';
  const sc=(m.ts!=null&&m.bs!=null)?`<span class="fx-agg"><span class="${tw?'':'v'}">${m.ts}</span> <span class="v">-</span> <span class="${bw?'':'v'}">${m.bs}</span></span>`
    :(isBye(m.top)||isBye(m.bot)?`<span class="fx-vs">BYE</span>`:`<span class="fx-vs">vs</span>`);
  const pen=(m.status==='ft'&&m.ts!=null&&m.ts===m.bs&&m.pts!=null&&m.pbs!=null)?`<span class="fx-st">Penalti ${m.pts}-${m.pbs}</span>`:`<span class="fx-st ${done?'ft':''}">${done?'Selesai':'Akan Datang'}</span>`;
  const L=tp?tbadge(tp):badge('#d9d6df',m.top==='BYE'?'BYE':'?');
  const R=bp?tbadge(bp):badge('#d9d6df',m.bot==='BYE'?'BYE':'?');
  return `<div class="fix"><div class="fix-head static">
    <div class="fx-side"><span class="nm" style="${tw?'font-weight:800':''}">${esc(tByeName)}</span>${L}</div>

    <div class="fx-side away">${R}<span class="nm" style="${bw?'font-weight:800':''}">${esc(bByeName)}</span></div></div></div>`;
}

function matchCardBig(m,tap){
  const w=koWinner(m), tw=w==='top', bw=w==='bot', done=matchDone(m), bye=isBye(m.top)||isBye(m.bot);
  const live=!done&&m.status==='live'&&isReal(m.top)&&isReal(m.bot);
  let status=done?(bye?'LOLOS · BYE':'SELESAI'):(live?'🔴 SEDANG':(isReal(m.top)&&isReal(m.bot)?'AKAN DATANG':'MENUNGGU'));
  let sc;
  if(m.ts!=null&&m.bs!=null)sc=`<span class="mc-n${tw?' win':''}">${m.ts}</span><span class="mc-col">⁚</span><span class="mc-n${bw?' win':''}">${m.bs}</span>`;
  else sc=`<span class="mc-vs">${bye?'BYE':'VS'}</span>`;
  const pen=(m.status==='ft'&&m.ts!=null&&m.ts===m.bs&&m.pts!=null&&m.pbs!=null)?`<div class="mc-pen">Penalti ${m.pts} - ${m.pbs}</div>`:'';
  const clickable=tap&&isReal(m.top)&&isReal(m.bot);
  return `<div class="mcard${clickable?' tapp':''}"${clickable?` data-score="${m.id}"`:''}><div class="mc-no">${koNo(m)}</div><div class="mc-status${done?' ft':''}${live?' live':''}">${status}</div>
    <div class="mc-body">${mcTeam(m.top,tw,'top')}<div class="mc-score">${sc}</div>${mcTeam(m.bot,bw,'bot')}</div>${pen}${clickable?`<div class="mc-tap">✎ ketuk untuk isi keputusan</div>`:''}</div>`;
}
function renderMatches(){
  const host=$('#tab-fixtures'); if(!host)return;

  if(fRound!=='all'&&!rounds.includes(fRound))fRound='all';
  let h=`<div class="chips mc-chips"><button class="chip${fRound==='all'?' active':''}" data-fr="all">Semua</button>`+
    rounds.map(r=>`<button class="chip${fRound===r?' active':''}" data-fr="${r}">${KOCAT[r]||KOLABEL[r]}</button>`).join('')+`</div>`;
  const show=fRound==='all'?rounds:[fRound];
  show.forEach(r=>{
    const rows=T.ko.filter(m=>m.round===r); if(!rows.length)return;
    const done=rows.filter(matchDone).length;
    h+=`<div class="fx-group"><span class="fx-gk">${KOLABEL[r]}</span><span class="fx-gn">${done}/${rows.length} selesai</span></div>`;

function mountBracket(root,opts){
  opts=opts||{};
  if(!T.ko||!T.ko.length){ root.innerHTML=`<div class="empty">Bracket belum diundi.<br>Buka <b>Admin → Undian → Undi rawak</b>.</div>`; return; }
  const rounds=koRounds(), cols=rounds.map(r=>[r,KOLABEL[r]]), MAX=cols.length-1;
  const st=opts.state||{a:0,b:9}; st.b=Math.min(st.b,MAX); st.a=Math.min(st.a,st.b);
  let h=bracketNavHTML(cols)+`<div class="koflow${opts.mirror?' mir':''}">`;
  rounds.forEach((r,ri)=>{ const inC=ri>0, outC=ri<rounds.length-1; h+=koCol(r,(outC?'out ':'')+(inC?'in':'')); });
  root.innerHTML=h+`</div>`;
  const seg=root.querySelector('.ko-seg'), flow=root.querySelector('.koflow'),
    win=root.querySelector('.ko-win'), cvL=root.querySelector('.cvL'), cvR=root.querySelector('.cvR');
  function idxFromX(x){ const r=seg.getBoundingClientRect(), px=x-r.left, ics=seg.querySelectorAll('.ko-ic'); for(let i=0;i<ics.length;i++){ if(px<ics[i].offsetLeft+ics[i].offsetWidth)return i; } return ics.length-1; }
  function positionWindow(){ const ics=seg.querySelectorAll('.ko-ic'),a=ics[st.a],b=ics[st.b]; if(!a||!b)return;
    const left=a.offsetLeft,w=b.offsetLeft+b.offsetWidth-a.offsetLeft; win.style.left=left+'px'; win.style.width=w+'px';
    cvL.style.left=left+'px'; cvR.style.left=(left+w-24)+'px';
    cvL.style.opacity=st.a===0?'.3':'1'; cvR.style.opacity=st.b===MAX?'.3':'1';
    ics.forEach((ic,i)=>ic.classList.toggle('in',i>=st.a&&i<=st.b)); }
  function applyLayout(scroll){ const fitW=flow.clientWidth-4,n=st.b-st.a+1; let kcw=Math.max(96,(fitW-26*(n-1))/n);
    flow.style.setProperty('--kcw',kcw+'px'); flow.classList.toggle('full',kcw>=196); positionWindow();
    const rEls=[...flow.querySelectorAll('.kcol.kround')];
    rEls.forEach(col=>{ const hasTP=!!col.querySelector('.km.tp');
      col.style.setProperty('--kmg',(hasTP?22:14)+'px');           // jarak seragam kecil
      const first=col.querySelector('.km'); if(first)first.style.marginTop='0px'; });   // semua naik ke atas
    if(scroll)requestAnimationFrame(()=>{ const col=flow.querySelectorAll('.kcol')[st.a]; if(col)flow.scrollTo({left:Math.max(0,col.offsetLeft-6),behavior:'smooth'}); }); }
  let drag=null;
  seg.addEventListener('pointerdown',e=>{ const onL=e.target.closest('.cvL'),onR=e.target.closest('.cvR');
    drag={mode:onL?'L':onR?'R':'move',a0:st.a,b0:st.b,i0:idxFromX(e.clientX),x0:e.clientX,moved:false}; seg.setPointerCapture(e.pointerId); seg.classList.add('grab'); });
  seg.addEventListener('pointermove',e=>{ if(!drag)return; if(Math.abs(e.clientX-drag.x0)>4)drag.moved=true; const idx=idxFromX(e.clientX);
    if(drag.mode==='move'){ const span=drag.b0-drag.a0,na=Math.max(0,Math.min(MAX-span,drag.a0+(idx-drag.i0))); st.a=na; st.b=na+span; }
    else if(drag.mode==='L'){ st.a=Math.min(st.b,idx); } else { st.b=Math.max(st.a,idx); } positionWindow(); });
  function endDrag(){ if(!drag)return; seg.classList.remove('grab');
    if(!drag.moved){ if(drag.mode==='L')st.a=Math.max(0,st.a-1); else if(drag.mode==='R')st.b=Math.min(MAX,st.b+1); else st.a=st.b=drag.i0; }
    drag=null; applyLayout(true); }
  seg.addEventListener('pointerup',endDrag); seg.addEventListener('pointercancel',endDrag);
  _brackets=_brackets.filter(b=>document.body.contains(b.flow));
  _brackets.push({flow,fn:()=>applyLayout(false)});
  requestAnimationFrame(()=>applyLayout(false));
}

function loadScript(src){ return new Promise((res,rej)=>{ if(window.html2canvas)return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function downloadBracketPNG(btn){
  const el=$('#tab-obs').querySelector('.obsc-scroll'); if(!el){toast('Carta tiada',1);return;}
  const old=btn.innerHTML; btn.innerHTML='⏳ Memproses…'; btn.disabled=true;
  try{

    const canvas=await window.html2canvas(el,{backgroundColor:'#ffffff',scale:2,windowWidth:el.scrollWidth,width:el.scrollWidth,height:el.scrollHeight});
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=(T.name||'carta').replace(/\s+/g,'-').toLowerCase()+'-carta.png'; a.click();

function layoutObsBracket(root){

/* ===== Undian Seeded (BETA) ===== */
const SEED_ORDER=['titanium','silver','platinum','gold'];
const SEED_LABEL={titanium:'1 · Titanium',silver:'4 · Silver',platinum:'2 · Platinum',gold:'3 · Gold'};
const SEED_SISTER={1:2,2:1,3:4,4:3};
function seedObj(){ if(!T.seed)T.seed={titanium:'',platinum:'',gold:'',silver:''}; return T.seed; }
function plotMatches(){ const frM=(T.ko||[]).filter(m=>m.round===firstRound()); return [frM.slice(0,4),frM.slice(4,8),frM.slice(8,12),frM.slice(12,16)]; }
function plotEmptySlots(pi){ const out=[]; (plotMatches()[pi-1]||[]).forEach(m=>{ if(m.top==='TBD')out.push([m,'top']); if(m.bot==='TBD')out.push([m,'bot']); }); return out; }
function plotOfTeam(id){ if(!id)return 0; const P=plotMatches(); for(let i=0;i<4;i++)if(P[i].some(m=>m.top===id||m.bot===id))return i+1; return 0; }
function seedPlaced(k){ const s=seedObj(); return !!s[k]&&plotOfTeam(s[k])>0; }
function nextSeed(){ return SEED_ORDER.find(k=>!seedPlaced(k)); }
function allowedPlots(){ const k=nextSeed(), s=seedObj(); if(!k)return [];
  if(k==='titanium')return [1,2,3,4];
  if(k==='silver'){ const pt=plotOfTeam(s.titanium); return pt?[SEED_SISTER[pt]]:[]; }
  if(k==='platinum'){ const pt=plotOfTeam(s.titanium); return pt?(pt<=2?[3,4]:[1,2]):[]; }
  if(k==='gold'){ const pp=plotOfTeam(s.platinum); return pp?[SEED_SISTER[pp]]:[]; }
  return [];
}
function seedBlinkPlots(){ const s=seedObj(); if(!s.titanium)return []; const nk=nextSeed(); if(!nk||!s[nk])return []; return allowedPlots(); }
function seedViolation(){ const s=seedObj();
  const pT=plotOfTeam(s.titanium), pS=plotOfTeam(s.silver), pP=plotOfTeam(s.platinum), pG=plotOfTeam(s.gold);
  if(pT&&pS&&pS!==SEED_SISTER[pT]) return `Silver mesti di Plot ${SEED_SISTER[pT]} (sister Titanium), bukan Plot ${pS}.`;
  if(pT&&pP){ const opp=pT<=2?[3,4]:[1,2]; if(!opp.includes(pP)) return `Platinum mesti di separuh bertentangan Titanium — Plot ${opp.join(' atau ')}, bukan Plot ${pP}.`; }
  if(pP&&pG&&pG!==SEED_SISTER[pP]) return `Gold mesti di Plot ${SEED_SISTER[pP]} (sister Platinum), bukan Plot ${pG}.`;
  return null;
}
function placeSeedRandom(){ const k=nextSeed(), s=seedObj(); if(!k||!s[k])return null;
  const plots=allowedPlots().filter(pi=>plotEmptySlots(pi).length); if(!plots.length)return null;
  const pi=plots[Math.floor(Math.random()*plots.length)], slots=plotEmptySlots(pi), sl=slots[Math.floor(Math.random()*slots.length)];
  sl[0][sl[1]]=s[k]; propagateKO(); return {seed:k,plot:pi};
}
function fillSession2(){ const s=seedObj(), seedIds=new Set([s.titanium,s.platinum,s.gold,s.silver].filter(Boolean));
  let rest=T.teams.filter(t=>!seedIds.has(t.id)&&plotOfTeam(t.id)===0).map(t=>t.id);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  const must=[],opt=[]; plotMatches().flat().forEach(m=>{ const tE=m.top==='TBD',bE=m.bot==='TBD';
    if(tE&&bE){ must.push([m,'top']); opt.push([m,'bot']); } else if(tE)opt.push([m,'top']); else if(bE)opt.push([m,'bot']); });
  const order=must.concat(opt);
  rest.forEach(id=>{ const sl=order.shift(); if(sl)sl[0][sl[1]]=id; });
  order.forEach(sl=>{ sl[0][sl[1]]='BYE'; }); propagateKO();
}
function admSeedDraw(){
  const s=seedObj(), hasKo=T.ko&&T.ko.length;
  const opt=(sel)=>`<option value="">— Pilih —</option>`+T.teams.map(t=>`<option value="${t.id}"${t.id===sel?' selected':''}>${esc(tName(t))}</option>`).join('');
  let h=`<div class="panel"><h2>🎯 Undian Seeded — BETA</h2>
    <p class="hint">Seeded top 4 tahun lepas. Titanium & Silver di separuh <b>sama</b> (jumpa di Separuh Akhir); Platinum & Gold di separuh bertentangan — jadi Titanium vs Platinum hanya jumpa di <b>Akhir</b>. Urutan cabut: Titanium → Silver → Platinum → Gold.</p>
    <div class="sd-seeds">
      <div class="field"><label>1 · Titanium</label><select class="sd-s" data-sd="titanium">${opt(s.titanium)}</select></div>
      <div class="field"><label>4 · Silver</label><select class="sd-s" data-sd="silver">${opt(s.silver)}</select></div>
      <div class="field"><label>2 · Platinum</label><select class="sd-s" data-sd="platinum">${opt(s.platinum)}</select></div>
      <div class="field"><label>3 · Gold</label><select class="sd-s" data-sd="gold">${opt(s.gold)}</select></div>
    </div>`;
  if(!hasKo){ h+=`<p class="hint" style="color:#c62222;font-weight:700">⚠ Tekan "Bracket kosong" di atas dahulu sebelum undian seeded.</p></div>`; return h; }
  const allowed=seedBlinkPlots(), nk=nextSeed(), PN=['Plot 1 · A1–A8','Plot 2 · A9–A16','Plot 3 · B1–B8','Plot 4 · B9–B16'];
  h+=`<div class="sd-turn">${nk?(s[nk]?`Giliran: <b>${SEED_LABEL[nk]}</b> — plot berkelip 👇. Letak pasukan di <b>Susun Peserta</b> di bawah ikut plot yang berkelip.`:`Pilih pasukan untuk <b>${SEED_LABEL[nk]}</b> dahulu`):'✔ Semua 4 seed diletak. Isi baki pasukan secara manual di Susun Peserta.'}</div>`;
  h+=`<div class="sd-board">`;
  for(let pi=1;pi<=4;pi++){ const blink=allowed.includes(pi), seedHere=SEED_ORDER.find(k=>s[k]&&plotOfTeam(s[k])===pi);
    const body=seedHere?`<div class="sd-seedtag">✓ ${SEED_LABEL[seedHere]}<br><b>${esc(tName(team(s[seedHere])))}</b></div>`:(blink?`<div class="sd-here">👉 letak di sini</div>`:`<div class="sd-empty">kosong</div>`);
    h+=`<div class="sd-plot${blink?' blink':''}${seedHere?' filled':''}"><div class="sd-pn">${PN[pi-1]}</div>${body}</div>`; }
  h+=`</div>`;
  h+=`<div class="btn-row"><button class="btn danger sm" id="sdReset">↺ Reset bracket</button></div></div>`;
  return h;
}

function switchTab(name){
  // SUB2 FIX: setiap pertukaran TAB UTAMA mesti membersihkan
  // paparan sub-tab lama supaya tidak terbawa ke tab baharu.
  const mainTabChanged=activeMainTab!==name;
  if(mainTabChanged){
    activeMainTab=name;
    Object.keys(curSub2).forEach(k=>{
      const first=SUBGROUPS[k]&&SUBGROUPS[k][0];
      curSub2[k]=first?first[0]:curSub2[k];
    });
  }

  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  const ab=$('#aboutBtn'); if(ab)ab.classList.toggle('live',name==='about');
  const grp=TABGROUPS[name], sn1=$('#subnav'), sn2=$('#subnav2'); let showSec;

  // Bersihkan SUB2 DOM dahulu pada setiap render.
  // Ini mengelakkan sub-tab lama kekal apabila tab utama berubah.
  if(sn2){ sn2.hidden=true; sn2.innerHTML=''; }

  if(grp){
    sn1.hidden=false;
    sn1.innerHTML=grp.map(x=>`<button class="subtab${curSub[name]===x[0]?' on':''}" data-l1="${name}|${x[0]}">${x[1]}</button>`).join('');
    sn1.querySelectorAll('[data-l1]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.l1.split('|');
      curSub[p[0]]=p[1];
      switchTab(p[0]);
    });

    const act=grp.find(x=>x[0]===curSub[name])||grp[0];
    if(typeof act[2]==='string' && act[2][0]==='#'){
      const gk=act[2].slice(1), sg=SUBGROUPS[gk];
      if(sn2&&sg){
        sn2.hidden=false;
        sn2.innerHTML=sg.map(x=>`<button class="subtab sub2${curSub2[gk]===x[0]?' on':''}" data-l2="${gk}|${x[0]}">${x[1]}</button>`).join('');
        sn2.querySelectorAll('[data-l2]').forEach(b=>b.onclick=()=>{
          const p=b.dataset.l2.split('|');
          curSub2[p[0]]=p[1];
          switchTab(name);
        });
      }
      showSec=(sg.find(x=>x[0]===curSub2[gk])||sg[0])[2];
    } else {
      showSec=act[2];
    }
  } else {
    if(sn1){ sn1.hidden=true; sn1.innerHTML=''; }
    showSec=name;
  }

  ALLSEC.forEach(t=>{ const el=$('#tab-'+t); if(el)el.hidden=(t!==showSec); });
  renderSection(showSec);
  window.scrollTo({top:0,behavior:'smooth'});
}

function handleUpload(file){

    const sc=Math.max(S/img.width,S/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
    t.logo=cn.toDataURL('image/jpeg',0.78);
    const b=document.querySelector('.tlogo[data-tlogo="'+CSS.escape(t.id)+'"]'); if(b){b.style.backgroundImage='url("'+t.logo+'")';b.classList.add('has');}
    const lu=document.querySelector('input[data-tlogourl="'+CSS.escape(t.id)+'"]'); if(lu)lu.value='';
    save(); renderPublic(); toast('Logo dimuat naik'); }; img.src=reader.result; };

  T.teams.forEach(t=>{ if(t.danceName==null)t.danceName=''; if(t.danceSynopsis==null)t.danceSynopsis=''; if(!t.social||typeof t.social!=='object')t.social={fb:'',ig:'',tt:''}; if(!t.video)t.video=''; if(!Array.isArray(t.ach))t.ach=[];
    if(!t.social||typeof t.social!=='object')t.social={fb:'',ig:'',tt:''};
    if(t.danceName===undefined)t.danceName=''; if(t.danceSynopsis===undefined)t.danceSynopsis=''; if(t.video===undefined)t.video='';
    if(t.flagName){ const f=STATES.find(x=>x[0]===t.flagName); if(f)t.flag=flagURL(f[1]); } });
  const before=fresh?'':JSON.stringify(T);
  if(T.ko.length)propagateKO();
  const changed=fresh||JSON.stringify(T)!==before||(_fbLive&&!_fromCloud);
  _lastSync=JSON.stringify(T);
  if(changed && !isViewOnly()) await save();     // muat naik data tempatan/baru ke awan kosong; elak tindih bila tak berubah
  applyBrand(); init(); renderPublic();
  syncBattleToLive();
  cloudBadge(_fbLive);
  if(_fbLive&&window.__FB&&window.__FB.sub){ try{ window.__FB.sub(applyRemote); }catch(e){ console.warn('sub fail',e); } }
})();
