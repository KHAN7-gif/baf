<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F8">
<title>Battle Zapin — Kejohanan Kalah Mati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F6F5F8; --panel:#FFFFFF; --panel-2:#F3F1F6; --raise:#FFFFFF;
    --line:rgba(24,16,32,.09); --line-2:rgba(24,16,32,.15);
    --txt:#191320; --muted:#8B8598;
    --mint:#E6007E; --mint-soft:rgba(230,0,126,.10); --cn:rgba(24,16,32,.18);
    --amber:#E6007E; --rose:#D6006B; --rose-soft:rgba(214,0,107,.10); --gold:#E6007E;
    --display:'Oswald',system-ui,sans-serif;
    --body:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--body);background:var(--ink);color:var(--txt);min-height:100vh;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 380px at 50% -120px,rgba(230,0,126,.10),transparent 70%),
      radial-gradient(700px 320px at 100% -60px,rgba(230,0,126,.06),transparent 70%)}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 14px 90px}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px;max-width:960px;margin:0 auto;
    background:linear-gradient(180deg,rgba(246,245,248,.94),rgba(246,245,248,.60));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .crest{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(145deg,#fff,#f2ecf1);border:1px solid var(--line-2);
    box-shadow:0 0 0 1px rgba(230,0,126,.20),0 8px 22px rgba(24,16,32,.10)}
  .tname{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tsub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
  .admin-btn{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:600;font-size:12.5px;
    color:var(--txt);background:var(--raise);border:1px solid var(--line-2);padding:9px 14px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:.18s}
  .admin-btn:hover{border-color:var(--mint);color:var(--mint)}
  .admin-btn.live{background:var(--mint);color:#fff;border-color:var(--mint)}

  .tabs{position:sticky;top:66px;z-index:25;display:flex;gap:6px;padding:8px;margin:0 auto 16px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:16px;max-width:960px}
  .tabs button{flex:1;font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-size:12.5px;
    color:var(--muted);background:transparent;border:0;padding:11px 4px;border-radius:11px;cursor:pointer;transition:.18s}
  .tabs button.active{background:#fff;color:var(--mint);box-shadow:0 2px 8px rgba(24,16,32,.08),inset 0 0 0 1px var(--line-2)}

  /* competition header */
  .comp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:600}
  .pill b{font-family:var(--display);letter-spacing:.5px;text-transform:uppercase;font-size:12px}
  .pill .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .pill.go{border-color:rgba(230,0,126,.35)}
  .pill.go b{color:var(--mint)}

  /* league table */
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.04)}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  .ghead h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:1.2px;text-transform:uppercase}
  .ghead .cols{display:flex;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
  .ghead .cols span{width:26px;text-align:center}
  .ghead .cols .pts{color:var(--txt)}
  .srow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-left:3px solid transparent}
  .srow + .srow{border-top:1px solid var(--line)}
  .srow[data-z="q"]{border-left-color:var(--mint)}
  .srow .pos{font-family:var(--mono);font-weight:800;font-size:13px;width:16px;text-align:center;color:var(--muted)}
  .srow[data-z="q"] .pos{color:var(--mint)}
  .srow .tn{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .tn .sub2{color:var(--muted);font-family:var(--mono);font-weight:700;font-size:11px}
  .srow .stt{display:flex;font-family:var(--mono);font-size:13px;font-weight:500}
  .srow .stt span{width:26px;text-align:center;color:var(--muted)}
  .srow .stt .gd{color:var(--txt)}
  .srow .stt .pts{color:var(--txt);font-weight:800}
  .srow[data-z="q"] .stt .pts{color:var(--mint)}

  .bdg{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-family:var(--mono);font-weight:800;font-size:9px;color:#fff;letter-spacing:.2px;
    background:var(--c,#333);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
  .bdg.img{background-size:cover;background-position:center;color:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
  .flag{width:18px;height:13px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line);vertical-align:middle;margin-right:6px}
  .sub2 .flag{width:14px;height:10px;margin:0 4px 0 0}
  .tlogo{display:inline-block;width:14px;height:14px;border-radius:50%;background-size:cover;background-position:center;vertical-align:middle;margin-right:4px;box-shadow:0 0 0 1px var(--line)}
  .mini{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--c,#555);background-size:cover;background-position:center;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .mini.img{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .duel .dn{display:flex;align-items:center;gap:6px}
  .duel .dn.a{justify-content:flex-end}
  .prev{display:flex;align-items:center;gap:9px;margin:6px 0 12px}
  .pl-row2{display:grid;grid-template-columns:22px 1fr 38px;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
  .pl-row2:last-child{border-bottom:0}
  .pl-row2 .pn{font-family:var(--mono);color:var(--muted);font-size:12px;text-align:center;padding-top:11px}
  .pl-row2 .stk{display:flex;flex-direction:column;gap:6px}
  .pl-row2 input{padding:9px 11px}
  .pl-row2 input[data-pp]{font-size:12px;color:var(--muted)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .adm-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
  .adm-col{display:flex;flex-direction:column;gap:7px}
  .adm-grp{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:11px;color:var(--mint);margin:0 2px 3px}
  .adm-col .chips{display:flex;flex-direction:column;gap:7px;margin:0}
  .adm-col .chip{width:100%;text-align:center}
  @media(max-width:640px){ .adm-groups{grid-template-columns:1fr;gap:12px} .adm-col .chips{flex-direction:row;flex-wrap:wrap} .adm-col .chip{width:auto} }
  .dw-side-h{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:11px;color:var(--mint);margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--line)}
  .dw-side-h:first-of-type{border-top:0;padding-top:0}
  .chip{font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-size:12px;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:10px;cursor:pointer;transition:.16s}
  .chip.active{background:#fff;color:var(--mint);border-color:rgba(230,0,126,.45);box-shadow:0 1px 5px rgba(24,16,32,.06)}
  .empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}

  /* home dashboard */
  .home-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .hstat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(24,16,32,.04)}
  .hstat .k{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .hstat b{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--txt)}
  .lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .lead-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.04)}
  .lead-card .lc-h{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:600;color:var(--mint);margin-bottom:10px}
  .lead-card .lc-b{display:flex;align-items:center;gap:10px;min-width:0}
  .lead-card .lc-n{min-width:0;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead-card .lc-n span{display:block;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .home-sec-t{font-family:var(--display);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;font-weight:600;color:var(--txt);margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
  @media(max-width:440px){.home-hero{grid-template-columns:repeat(2,1fr)}.lead-grid{grid-template-columns:1fr}}

  /* fixtures */
  .fx-group{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 9px}
  .fx-group:first-of-type{margin-top:8px}
  .fx-gk{font-family:var(--display);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;font-weight:600;color:var(--txt)}
  .fx-gn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}

  /* big match cards (Perlawanan) */
  .mc-chips{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mc-chips::-webkit-scrollbar{display:none}
  .mc-chips .chip{flex:none}
  .mcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 12px 13px;margin-bottom:13px;box-shadow:0 1px 3px rgba(24,16,32,.04),0 10px 26px rgba(24,16,32,.05)}
  .mc-status{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:8px;padding:4px 13px;white-space:nowrap}
  .mc-status.ft{background:var(--mint)}
  .mc-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .mc-team{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .mc-logo{position:relative;width:62px;height:62px;border-radius:50%;background:var(--panel-2);box-shadow:0 0 0 1px var(--line)}
  .mc-img{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center}
  .mc-init{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;letter-spacing:.5px}
  .mc-flag{position:absolute;right:-3px;bottom:-3px;width:24px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 2px var(--panel)}
  .mc-name{font-weight:700;font-size:13px;text-align:center;line-height:1.2;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mc-team.w .mc-name{color:var(--mint)}
  .mc-sidebar{height:5px;width:46px;border-radius:3px;background:transparent}
  .mc-team.red .mc-sidebar{background:#E23B3B}
  .mc-team.green .mc-sidebar{background:#22B36B}
  .mc-team.red .mc-logo{box-shadow:0 0 0 3px #E23B3B}
  .mc-team.green .mc-logo{box-shadow:0 0 0 3px #22B36B}
  .mc-score{display:flex;align-items:center;gap:9px;padding:0 4px}
  .mc-n{font-family:var(--mono);font-weight:800;font-size:34px;color:var(--muted);line-height:1}
  .mc-n.win{color:var(--mint)}
  .mc-col{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--line-2)}
  .mc-vs{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:2px}
  .mc-pen{text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mint);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  @media(max-width:360px){.mc-logo{width:52px;height:52px}.mc-n{font-size:28px}.mc-name{font-size:12px}}
  .mcard.tapp{cursor:pointer;transition:.14s;-webkit-tap-highlight-color:transparent}
  .mcard.tapp:hover{border-color:var(--mint);box-shadow:0 1px 3px rgba(24,16,32,.05),0 12px 30px rgba(230,0,126,.12)}
  .mcard.tapp:active{transform:scale(.99)}
  .mc-tap{text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:9px;font-weight:600;color:var(--mint);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .mc-no{position:absolute;top:9px;left:11px;font-family:var(--mono);font-weight:800;font-size:10px;color:var(--muted);letter-spacing:.5px}
  .km-no{position:absolute;top:-13px;left:2px;font-family:var(--mono);font-weight:800;font-size:9px;color:var(--muted);letter-spacing:.4px;z-index:2}
  .kteam .kpn{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--muted)}
  .kteam.win .kpn{color:var(--mint)}
  .obsc-ft b{color:var(--mint)}
  @keyframes obsPulse{0%,100%{box-shadow:0 2px 10px rgba(24,16,32,.06);border-color:var(--mint)}50%{box-shadow:0 0 0 3px rgba(230,0,126,.30),0 0 22px rgba(230,0,126,.45);border-color:var(--mint)}}
  @keyframes obsBlink{0%,49%{opacity:1}50%,100%{opacity:.15}}
  .obsc-box.live{border-color:var(--mint);animation:obsPulse 1.05s ease-in-out infinite}
  .obsc-live{color:var(--mint);font-weight:800;letter-spacing:.5px;animation:obsBlink 1.05s step-start infinite}
  .mc-status.live{color:var(--mint)}
  .sm-st.liveon{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
  .sm-st3{flex-wrap:nowrap}
  .sm-st3 .btn{padding:11px 4px;font-size:11.5px;white-space:nowrap}
  .obsc-pen{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--muted)}
  .obsc-team.win .obsc-pen{color:var(--mint)}

  /* score picker modal */
  .sm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sm-row:last-of-type{border-bottom:0}
  .sm-team{display:flex;align-items:center;gap:8px;min-width:110px;flex:1}
  .sm-logo{width:30px;height:30px;border-radius:50%;flex:none;background-size:cover;background-position:center;background-color:var(--panel-2);box-shadow:0 0 0 1px var(--line);overflow:hidden}
  .sm-nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sm-nums{display:flex;gap:6px;margin-left:auto}
  .sm-num{width:38px;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt);font-family:var(--mono);font-weight:800;font-size:16px;cursor:pointer;transition:.12s}
  .sm-num:hover{border-color:var(--mint)}
  .sm-num.on{background:var(--mint);color:#fff;border-color:var(--mint)}
  .sm-pen-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:12px 0 2px}
  .sm-actions{display:flex;gap:9px;margin-top:16px}
  .sm-actions .btn{flex:1}
  .sm-act2{margin-top:9px}
  .sm-st.on{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
  @media(max-width:380px){.sm-num{width:33px;height:40px;font-size:15px}.sm-nums{gap:4px}}

  /* team detail modal */
  .td-head{text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .td-logowrap{position:relative;width:88px;height:88px;margin:0 auto 10px}
  .td-logo{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 1px var(--line),0 10px 24px rgba(24,16,32,.12)}
  .td-flag{position:absolute;right:-4px;bottom:-2px;width:34px;height:23px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 3px var(--panel)}
  .td-nm{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.3px;line-height:1.15}
  .td-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
  .td-sec-t{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:600;color:var(--mint);margin-bottom:10px}
  .td-empty{color:var(--muted);font-size:13px;padding:6px 0}
  .ach-row{display:flex;align-items:center;gap:9px;padding:6px 0}
  .ach-row.ro{border-bottom:1px solid var(--line)}
  .ach-n{font-family:var(--mono);font-weight:800;font-size:12px;color:var(--mint);width:20px;text-align:center;flex:none}
  .ach-txt{font-weight:600;font-size:14px}
  .ach-in{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-family:var(--body);font-weight:600;font-size:14px;color:var(--txt)}
  .ach-in:focus{outline:none;border-color:var(--mint)}
  .srow.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .srow.tap:active{background:var(--panel-2)}

  /* OBS / LED display — classic two-sided bracket */
  .obs-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .obs-title{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:16px}
  .obsc-scroll{overflow-x:auto;padding:6px 0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .obsc-scroll::-webkit-scrollbar{height:8px}.obsc-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
  .obsc{display:flex;gap:24px;align-items:flex-start;width:max-content;padding:0 4px}
  .obsc-col{display:flex;flex-direction:column;flex:0 0 auto;width:128px}
  .obsc-col.center{width:172px}
  .obsc-h{font-family:var(--display);text-transform:uppercase;letter-spacing:.7px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:12px;white-space:nowrap}
  .obsc-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 3px rgba(24,16,32,.05)}
  .obsc-ft{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:3px 8px 0}
  .obsc-team{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;font-family:var(--mono);font-weight:700;font-size:12px;position:relative}
  .obsc-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,transparent)}
  .obsc-pos{font-family:var(--mono);font-weight:800;font-size:10px;color:var(--muted);min-width:22px;text-align:center;flex:none}
  .obsc-team.win .obsc-pos{color:var(--mint)}
  .obsc-team.bye .obsc-bar,.obsc-team.tbd .obsc-bar{display:none}

  /* ---------- bracket ---------- */
  .ko-nav{margin:2px 2px 16px}

  .ko-lbl{flex:1;background:none;border:0;cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:1.2px;color:var(--muted);padding:2px 0;transition:color .2s}

  .ko-win{position:absolute;top:5px;bottom:5px;left:0;width:60px;background:var(--mint);border-radius:11px;z-index:1;transition:left .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 12px rgba(230,0,126,.30)}

    font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:color .18s}

<script>
const KEY='battlezapin_v1';
let T=null, adminOK=false;

let _lastSync='', _fbLive=false, _fromCloud=false, _juri=null, _overlay=null;

/* ---------- storage (Firebase Firestore first, localStorage backup) ---------- */
const mem={};
function fbReady(){ return !!(window.__FB); }
function waitFB(ms=8000){
  if(window.__FB)return Promise.resolve(true);
  return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){done=true;res(v);} };
    window.addEventListener('fb-ready',()=>fin(true),{once:true});
    window.addEventListener('fb-fail',()=>fin(false),{once:true});
    setTimeout(()=>fin(!!window.__FB),ms); });
}
const Store={
  async get(k){
    _fromCloud=false;
    try{ if(fbReady()){ const v=await window.__FB.get(); if(v!=null){ _fromCloud=true; return v; } } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v)return JSON.parse(v); }catch(e){}
    return mem[k]??null;
  },
  async set(k,val){ const s=JSON.stringify(val); mem[k]=val;
    try{ localStorage.setItem(k,s); }catch(e){}          // sandaran tempatan sentiasa
    if(fbReady()&&!isViewOnly()){ try{ await window.__FB.set(val); }catch(e){ console.warn('cloud save fail',e); try{toast('Gagal simpan ke awan',1);}catch(_){}} }
  }
};

/* ---------- live judge voting (dokumen 'live', medan berasingan) ---------- */
const NJUDGES=5, LKEY='bz_live';
let LV={};
function liveDefaults(){ const o={rl:'Merah',yl:'Hijau'}; for(let i=0;i<NJUDGES;i++){ o['n'+i]='Juri '+(i+1); o['v'+i]=null; o['a'+i]=true; } return o; }
function liveLoadLocal(){ try{ const v=localStorage.getItem(LKEY); if(v)LV=JSON.parse(v); }catch(e){} if(!LV||typeof LV!=='object')LV={}; }
function liveSaveLocal(){ try{ localStorage.setItem(LKEY,JSON.stringify(LV)); }catch(e){} }
async function liveSet(patch){ Object.assign(LV,patch); liveSaveLocal();
  if(fbReady()&&window.__FB.setLive){ try{ await window.__FB.setLive(patch); }catch(e){ console.warn('live save',e); } } }
function liveLabels(){ return { red:LV.rl||'Merah', green:LV.yl||'Hijau' }; }
function liveJudges(){ const out=[]; for(let i=0;i<NJUDGES;i++)out.push({i,name:LV['n'+i]||('Juri '+(i+1)),vote:LV['v'+i]||null,active:LV['a'+i]!==false}); return out; }
function liveTally(){ let r=0,g=0; for(let i=0;i<NJUDGES;i++){ const v=LV['v'+i]; if(v==='red')r++; else if(v==='green')g++; } return {r,g}; }
function judgeLink(i){ return location.origin+location.pathname+'?juri='+(i+1); }
function getJuri(){ try{ const p=new URLSearchParams(location.search).get('juri'); const n=parseInt(p); return (n>=1&&n<=NJUDGES)?(n-1):null; }catch(e){ return null; } }
/* pasukan battle ikut match yang sedang LIVE (merah=atas, hijau=bawah) */
function liveMatch(){ return (typeof T==='object'&&T&&T.ko)?T.ko.find(x=>x.status==='live'&&isReal(x.top)&&isReal(x.bot)):null; }
function battleSides(){ const L=liveLabels(), m=liveMatch();
  if(m)return {red:{team:team(m.top),label:tName(team(m.top))},green:{team:team(m.bot),label:tName(team(m.bot))},match:m};
  return {red:{team:null,label:L.red},green:{team:null,label:L.green},match:null}; }
function sideTeamHTML(t){ if(!t)return '';
  const logo=t.logo?`<span class="ovt-logo" style="background-image:url('${imgSrc(t.logo)}')"></span>`:`<span class="ovt-dot" style="background:${t.color}"></span>`;
  const flag=t.flag?`<img class="ovt-flag" src="${imgSrc(t.flag)}" alt="">`:'';
  return `<span class="ovt-mark">${logo}${flag}</span>`; }
function syncBattleToLive(){ if(_juri!==null||isViewOnly())return; const m=liveMatch(); if(!m)return;
  const a=team(m.top), b=team(m.bot), patch={};
  const setIf=(k,v)=>{ v=v||''; if((LV[k]||'')!==v)patch[k]=v; };
  setIf('rl',tName(a)); setIf('yl',tName(b));
  setIf('rlogo',a.logo||''); setIf('ylogo',b.logo||'');
  setIf('rflag',a.flag||''); setIf('yflag',b.flag||'');
  setIf('rcolor',a.color||''); setIf('ycolor',b.color||'');
  if(Object.keys(patch).length)liveSet(patch); }

/* ---------- Malaysian state flags ---------- */
const STATES=[
 ['Johor','Flag of Johor.svg'],['Kedah','Flag of Kedah.svg'],['Kelantan','Flag of Kelantan.svg'],
 ['Melaka','Flag of Malacca.svg'],['N. Sembilan','Flag of Negeri Sembilan.svg'],['Pahang','Flag of Pahang.svg'],
 ['Perak','Flag of Perak.svg'],['Perlis','Flag of Perlis.svg'],['P. Pinang','Flag of Penang (Malaysia).svg'],
 ['Sabah','Flag of Sabah.svg'],['Sarawak','Flag of Sarawak.svg'],['Selangor','Flag of Selangor.svg'],
 ['Terengganu','Flag of Terengganu.svg'],['W.P. Kuala Lumpur','https://upload.wikimedia.org/wikipedia/commons/6/64/Flag_of_Kuala_Lumpur%2C_Malaysia.svg'],
 ['W.P. Labuan','Flag of Labuan.svg'],['W.P. Putrajaya','Flag of Putrajaya.svg'],
 ['Brunei','https://upload.wikimedia.org/wikipedia/commons/9/9c/Flag_of_Brunei.svg'],
 ['Indonesia','https://upload.wikimedia.org/wikipedia/commons/9/9f/Flag_of_Indonesia.svg']
];
const flagURL=f=>/^https?:/.test(f)?f:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f);

/* ---------- seed ---------- */
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));return Math.round(255*c).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}
function seed(){
  const teams=[];
  for(let i=0;i<30;i++)teams.push({id:'T'+i,name:'',short:'',color:hsl2hex(Math.round(i*360/30),64,56),logo:'',flag:'',flagName:'',ach:[]});
  return {name:'BATTLE ZAPIN',sub:'Kejohanan Kalah Mati',pin:'1234',adminUser:'admin',adminPass:'1234',teamCount:30,thirdPlace:true,teams,ko:[],
    dance:{title:'Tarian Kreatif Borneo',s1:{name:'Sesi 1',date:'26-09-2026 (Sabtu)',time:'2.00 Petang',teams:Array(15).fill('')},s2:{name:'Sesi 2',date:'26-09-2026 (Sabtu)',time:'7.00 Malam',teams:Array(15).fill('')}}};
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>(s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const team=id=>T.teams.find(t=>t.id===id);
const tIndex=id=>T.teams.findIndex(t=>t.id===id);
const tName=t=>t&&t.name&&t.name.trim()?t.name:('Pasukan '+(tIndex(t?t.id:'')+1));
const tShort=t=>{ if(!t)return '?'; if(t.short&&t.short.trim())return t.short.toUpperCase().slice(0,5); const n=t.name&&t.name.trim()?t.name:''; return n?n.replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase()||('P'+(tIndex(t.id)+1)):('P'+(tIndex(t.id)+1)); };
function imgSrc(url){ if(!url)return ''; url=url.trim();
  const m=url.match(/\/file\/d\/([-\w]{10,})/)||url.match(/[?&]id=([-\w]{10,})/)||url.match(/\/d\/([-\w]{10,})/);
  return m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400'):url; }
const badge=(c,txt)=>`<span class="bdg" style="--c:${c}">${esc((txt||'').slice(0,3))}</span>`;
function tbadge(t){ return t&&t.logo?`<span class="bdg img" style="background-image:url('${imgSrc(t.logo)}')"></span>`:badge(t?t.color:'#444',t?tShort(t):'?'); }
function flagImg(t){ return t&&t.flag?`<img class="flag" src="${imgSrc(t.flag)}" alt="" loading="lazy">`:''; }
function toast(m,err){const e=$('#toast');e.textContent=m;e.className='toast show'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',1900);}
const isBye=c=>c==='BYE';
const isReal=c=>c&&c!=='TBD'&&c!=='BYE';

/* ---------- knockout engine ---------- */
const KORDER=['R32','R16','QF','SF','F'];
const KOLABEL={R32:'Kumpulan',R16:'Top 16',QF:'Suku Akhir',SF:'Separuh Akhir',F:'Akhir',TP:'Tempat Ke-3 & 4'};
const KOSHORT={R32:'P1',R16:'T16',QF:'T8',SF:'T4',F:'F'};
const KOCAT={R32:'Kumpulan',R16:'Top 16',QF:'Suku Akhir',SF:'Separuh Akhir',F:'Akhir',TP:'Tempat Ke-3 & 4'};
const KFIRST={32:'R32',16:'R16',8:'QF',4:'SF',2:'F'};
function bracketSize(){ const n=Math.max(2,T.teams.length); let s=2; while(s<n)s*=2; return Math.min(32,s); }
function buildKO(size){
  const start=KFIRST[size], rounds=KORDER.slice(KORDER.indexOf(start)), ko=[];
  rounds.forEach((r,ri)=>{ const n=(size/2)/Math.pow(2,ri);
    for(let i=0;i<n;i++){ const m={id:r+'_'+i,round:r,top:'TBD',bot:'TBD',ts:null,bs:null,pts:null,pbs:null,status:'sched',next:null,slot:null};
      if(ri<rounds.length-1){ m.next=rounds[ri+1]+'_'+Math.floor(i/2); m.slot=i%2?'bot':'top'; } ko.push(m); } });
  return ko;
}
function koWinner(m){
  const tR=isReal(m.top), bR=isReal(m.bot);
  if(m.top==='BYE'&&bR)return 'bot';
  if(m.bot==='BYE'&&tR)return 'top';
  if(m.ts==null||m.bs==null)return null;
  if(m.ts>m.bs)return 'top'; if(m.bs>m.ts)return 'bot';
  if(m.pts!=null&&m.pbs!=null&&m.pts!==m.pbs)return m.pts>m.pbs?'top':'bot';
  return null;
}
function firstRound(){ const rs=koRounds(); return rs[0]; }
function propagateKO(){
  if(!T.ko)return; const by={}; T.ko.forEach(m=>by[m.id]=m);
  const targets=new Set(T.ko.filter(m=>m.next).map(m=>m.next));
  T.ko.forEach(m=>{ if(targets.has(m.id)){ m.top='TBD'; m.bot='TBD'; } });
  T.ko.forEach(m=>{ const w=koWinner(m); if(w&&m.next){ const nm=by[m.next]; if(nm)nm[m.slot]=(w==='top'?m.top:m.bot); } });
  if(T.thirdPlace){
    const tp=by['TP_0'], sfs=T.ko.filter(m=>m.round==='SF');
    if(tp&&sfs.length===2){ sfs.forEach((m,i)=>{ const slot=i===0?'top':'bot', w=koWinner(m); tp[slot]=w?(w==='top'?m.bot:m.top):'TBD'; }); }
  }
  // auto-finalize: bila skor sudah menentukan pemenang antara 2 pasukan sebenar, tandakan Selesai
  T.ko.forEach(m=>{ if(isReal(m.top)&&isReal(m.bot)&&koWinner(m))m.status='ft'; });
}
function koRounds(){ const out=[]; KORDER.forEach(r=>{ if(T.ko&&T.ko.some(m=>m.round===r))out.push(r); }); return out; }
function newBracket(){
  const size=bracketSize(), ko=buildKO(size);
  if(T.thirdPlace&&size>=4)ko.push({id:'TP_0',round:'TP',top:'TBD',bot:'TBD',ts:null,bs:null,pts:null,pbs:null,status:'sched',next:null,slot:null,motm:null});
  T.ko=ko; propagateKO();
}
function drawRandom(){
  const size=bracketSize(); newBracket();
  const fr=firstRound(), frM=T.ko.filter(m=>m.round===fr);
  const ids=T.teams.map(t=>t.id).slice(0,size);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const byes=size-ids.length;
  // distribute byes into distinct matches (spread across halves)
  const byeSlots=new Set(); const step=Math.max(1,Math.floor((size/2)/Math.max(1,byes)));
  for(let b=0,mi=0;b<byes;b++,mi+=step){ byeSlots.add((mi%(size/2))*2+1); }
  const slots=new Array(size).fill(null); let ti=0;
  for(let i=0;i<size;i++){ if(byeSlots.has(i)){ slots[i]='BYE'; continue; } slots[i]=ids[ti++]||'BYE'; }
  frM.forEach((m,k)=>{ m.top=slots[2*k]; m.bot=slots[2*k+1]; });
  propagateKO();
}
function finalStandings(){
  const F=(T.ko||[]).find(m=>m.round==='F');
  let champ=null,runner=null,third=null,fourth=null;
  if(F){ const w=koWinner(F); if(w){ champ=w==='top'?F.top:F.bot; runner=w==='top'?F.bot:F.top; } }
  const TP=(T.ko||[]).find(m=>m.round==='TP');
  if(TP){ const w=koWinner(TP); if(w){ third=w==='top'?TP.top:TP.bot; fourth=w==='top'?TP.bot:TP.top; } }
  return {champ,runner,third,fourth};
}
function teamStatus(id){
  if(!T.ko||!T.ko.length)return {cls:'tbd',label:'Belum diundi'};
  const fs=finalStandings();
  if(fs.champ===id)return {cls:'champ',label:'🏆 Juara'};
  if(fs.runner===id)return {cls:'in',label:'🥈 Naib Juara'};
  if(fs.third===id)return {cls:'in',label:'🥉 Tempat Ke-3'};
  let seen=false,elimRound=null;
  T.ko.forEach(m=>{ if(m.round==='TP')return; if(m.top===id||m.bot===id){ seen=true; const w=koWinner(m); if(w){ const winId=w==='top'?m.top:m.bot; if(winId!==id)elimRound=m.round; } } });
  if(elimRound)return {cls:'out',label:'Tersingkir · '+KOLABEL[elimRound]};
  if(seen)return {cls:'in',label:'Dalam saingan'};
  return {cls:'tbd',label:'Belum diundi'};
}
function koMatches(){ return (T.ko||[]).filter(m=>m.round!=='TP'); }
function matchDone(m){ return m.status==='ft'||koWinner(m)!=null; }
function koNo(m){ if(!m||!T.ko)return ''; let n=0; for(const r of KORDER.concat('TP')){ const arr=T.ko.filter(y=>y.round===r); for(const x of arr){ n++; if(x.id===m.id)return 'M'+n; } } return ''; }

/* ---------- render: HOME ---------- */
function statHead(){
  const done=koMatches().filter(matchDone).length, total=koMatches().length;
  return `<div class="home-hero">
    <div class="hstat"><span class="k">Pasukan</span><b>${T.teams.length}</b></div>
    <div class="hstat"><span class="k">Perlawanan</span><b>${total}</b></div>
    <div class="hstat"><span class="k">Selesai</span><b>${done}</b></div>
    <div class="hstat"><span class="k">Baki</span><b>${Math.max(0,total-done)}</b></div></div>`;
}
function renderHome(){
  const host=$('#tab-home'); if(!host)return;
  let h='';
  const fs=finalStandings();
  if(isReal(fs.champ)){ const c=team(fs.champ);
    h+=`<div class="champ-banner"><div>${tbadge(c)}</div><div style="min-width:0"><div class="cb-t">Juara Battle Zapin</div><div class="cb-n">${flagImg(c)}${esc(tName(c))}</div></div><div class="cb-tr">🏆</div></div>`;
  }
  h+=statHead();
  // final standings
  const rows=[['🥇','Juara',fs.champ],['🥈','Naib Juara',fs.runner],['🥉','Tempat Ke-3',fs.third],['4','Tempat Ke-4',fs.fourth]];
  h+=`<div class="gcard"><div class="ghead"><h3>Kedudukan Akhir</h3></div>`;
  rows.forEach(([ic,lab,id])=>{ const t=isReal(id)?team(id):null;
    h+=`<div class="srow"><span class="pos">${ic}</span>${t?tbadge(t):badge('#ccc','–')}
      <span class="tn">${t?flagImg(t)+esc(tName(t)):'<span style="color:var(--muted)">— Belum ditentukan</span>'}</span>
      <span class="stat-pill" style="font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-size:10px;color:var(--muted)">${lab}</span></div>`;
  });
  h+=`</div>`;
  // recent + upcoming
  const done=koMatches().filter(matchDone), upc=koMatches().filter(m=>!matchDone(m)&&isReal(m.top)&&isReal(m.bot));
  if(done.length){ h+=`<div class="home-sec-t">Keputusan Terkini</div>`; done.slice(-4).reverse().forEach(m=>h+=matchCard(m,true)); }
  if(upc.length){ h+=`<div class="home-sec-t">Akan Datang</div>`; upc.slice(0,4).forEach(m=>h+=matchCard(m,true)); }
  if(!T.ko||!T.ko.length)h+=`<div class="empty">Bracket belum diundi. Admin boleh buat undian di tab Admin → Undian.</div>`;
  host.innerHTML=h;
}

/* ---------- render: PASUKAN ---------- */
function renderTeams(){
  const host=$('#tab-teams'); if(!host)return;
  let h=`<div class="gcard"><div class="ghead"><h3>Pasukan · ${T.teams.length}</h3><span class="fx-gn">ketuk untuk detail</span></div>`;

      <span class="tstat ${st.cls}">${st.label}</span></div>`;
  });
  h+=`</div>`;

function openTeamDetail(id){ activeDetail=id; buildTeamDetail(); const m=$('#teamModal'); if(m)m.hidden=false; }
function buildTeamDetail(){

  let h=`<div class="td-head"><div class="td-logowrap">${logo}${flag}</div>
    <div class="td-nm">${esc(tName(t))}</div>

    ? `<div class="ach-row"><span class="ach-n">${i+1}</span><input class="ach-in" data-ai="${i}" value="${esc(a)}" placeholder="Kejayaan ${i+1}"><button class="icon-btn" data-adel="${i}" style="width:34px;height:36px">✕</button></div>`
    : `<div class="ach-row ro"><span class="ach-n">${i+1}</span><span class="ach-txt">${esc(a)}</span></div>`; });

    let sv=null; const flush=()=>{ clearTimeout(sv); sv=setTimeout(()=>{save();renderPublic();},350); };

  function idxFromX(x){ const r=seg.getBoundingClientRect(), px=x-r.left, ics=seg.querySelectorAll('.ko-ic'); for(let i=0;i<ics.length;i++){ if(px<ics[i].offsetLeft+ics[i].offsetWidth)return i; } return ics.length-1; }

  let drag=null;
  seg.addEventListener('pointerdown',e=>{ const onL=e.target.closest('.cvL'),onR=e.target.closest('.cvR');
    drag={mode:onL?'L':onR?'R':'move',a0:st.a,b0:st.b,i0:idxFromX(e.clientX),x0:e.clientX,moved:false}; seg.setPointerCapture(e.pointerId); seg.classList.add('grab'); });

  if(!document.fullscreenElement){ const rq=el.requestFullscreen||el.webkitRequestFullscreen; if(rq)rq.call(el).catch(()=>{}); document.body.classList.add('obs-full'); }
  else { if(document.exitFullscreen)document.exitFullscreen(); document.body.classList.remove('obs-full'); }
  setTimeout(()=>{ const r=$('#tab-obs'); if(r)layoutObsBracket(r); },240);
}

/* ---------- admin ---------- */
function renderAdmin(){
  const c=$('#tab-admin');
  if(!adminOK){
    c.innerHTML=`<div class="lock"><div class="crest">🔒</div>
      <div class="panel"><h2>Log masuk admin</h2><p class="hint">Masukkan nama pengguna &amp; kata laluan untuk urus kejohanan.</p>
      <div class="field"><label>Nama pengguna</label><input type="text" id="admUser" autocomplete="username" placeholder="admin"></div>
      <div class="field"><label>Kata laluan</label><input type="password" id="admPass" autocomplete="current-password" placeholder="••••••"></div>
      <button class="btn" id="pinGo">Log masuk</button></div></div>`;
    const tryLogin=()=>{ const u=($('#admUser').value||'').trim(), p=$('#admPass').value||'';
      if(u===(T.adminUser||'admin')&&p===(T.adminPass||T.pin||'1234')){ adminOK=true; $('#adminBtn').classList.add('live'); updateObsTab(); renderAdmin(); toast('Selamat datang, '+u); }
      else toast('Nama pengguna atau kata laluan salah',1); };
    $('#pinGo').onclick=tryLogin;
    $('#admUser').onkeydown=$('#admPass').onkeydown=e=>{if(e.key==='Enter')tryLogin();};
    return;
  }
  const admGroups=[
    ['Tingkah Geruh',[['voting','Voting'],['results','Keputusan'],['draw','Undian Tingkah Geruh']]],
    ['Tarian Kreatif',[['dance','Undian Tarian Kreatif']]],
    ['Umum',[['teams','Pasukan'],['settings','Tetapan']]]
  ];
  let h=`<div class="adm-groups">`;
  admGroups.forEach(g=>{ h+=`<div class="adm-col"><div class="adm-grp">${g[0]}</div><div class="chips">`+
    g[1].map(s=>`<button class="chip${adSec===s[0]?' active':''}" data-as="${s[0]}">${s[1]}</button>`).join('')+`</div></div>`; });
  h+=`</div>`;
  if(adSec==='draw')h+=admDraw();
  else if(adSec==='results')h+=admResults();
  else if(adSec==='teams')h+=admTeams();
  else if(adSec==='voting')h+=admVoting();
  else if(adSec==='dance')h+=admDance();
  else h+=admSettings();
  c.innerHTML=h;
  c.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{adSec=b.dataset.as;renderAdmin();});
  if(adSec==='draw')bindDraw();
  else if(adSec==='results')bindResults();
  else if(adSec==='teams')bindTeams();
  else if(adSec==='voting')bindVoting();
  else if(adSec==='dance')bindDance();
  else bindSettings();
}

/* --- admin: draw --- */
function teamOpts(sel){ return `<option value="TBD"${sel==='TBD'||!sel?' selected':''}>— Kosong —</option><option value="BYE"${sel==='BYE'?' selected':''}>BYE</option>`+
  T.teams.map(t=>`<option value="${t.id}"${sel===t.id?' selected':''}>${esc(tName(t))}</option>`).join(''); }
function admDraw(){
  let h=`<div class="panel"><h2>Undian Tingkah Geruh</h2><p class="hint">${T.teams.length} pasukan · bracket ${bracketSize()} slot (baki jadi <b>BYE</b>, lolos automatik). Tekan undi rawak, atau susun sendiri di bawah. Pemenang naik automatik bila skor dimasukkan.</p>
    <div class="btn-row"><button class="btn" id="drawRnd">🎲 Undi rawak</button><button class="btn ghost" id="drawEmpty">Bracket kosong</button></div></div>`;
  if(T.ko&&T.ko.length){
    const fr=firstRound(), frM=T.ko.filter(m=>m.round===fr);
    const half=a=>[a.slice(0,Math.ceil(a.length/2)),a.slice(Math.ceil(a.length/2))];
    const [Lm,Rm]=half(frM);
    h+=`<div class="panel"><h2>${KOLABEL[fr]} · susun peserta</h2>`;
    const rows=(list,ch)=>{ let n=1; list.forEach(m=>{
      const tc=m.top==='BYE'?'BYE':ch+(n++), bc=m.bot==='BYE'?'BYE':ch+(n++);
      h+=`<div class="draw-ed" data-dm="${m.id}"><div class="mno">${tc} · ${bc}</div>
        <select class="dw-top">${teamOpts(m.top)}</select><span class="vs">lwn</span><select class="dw-bot">${teamOpts(m.bot)}</select></div>`;
    }); };
    h+=`<div class="dw-side-h">Sebelah A · kiri (A1–A15)</div>`; rows(Lm,'A');
    h+=`<div class="dw-side-h">Sebelah B · kanan (B1–B15)</div>`; rows(Rm,'B');
    h+=`<button class="btn" id="drawSave" style="margin-top:12px">Simpan undian</button></div>`;
  }
  return h;
}
function bindDraw(){
  const c=$('#tab-admin');
  $('#drawRnd').onclick=async()=>{ if(T.teams.every(t=>!t.name||!t.name.trim())&&!confirm('Kebanyakan pasukan belum bernama. Teruskan undi rawak?'))return; drawRandom(); await save(); renderPublic(); renderAdmin(); toast('Undian rawak selesai'); };
  $('#drawEmpty').onclick=async()=>{ if(!confirm('Jana bracket kosong (padam undian & keputusan)?'))return; newBracket(); await save(); renderPublic(); renderAdmin(); toast('Bracket kosong dijana'); };
  if($('#drawSave'))$('#drawSave').onclick=async()=>{
    c.querySelectorAll('.draw-ed[data-dm]').forEach(row=>{ const m=T.ko.find(x=>x.id===row.dataset.dm); if(!m)return;
      m.top=row.querySelector('.dw-top').value; m.bot=row.querySelector('.dw-bot').value; });
    propagateKO(); await save(); renderPublic(); renderAdmin(); toast('Undian disimpan');
  };
}

/* --- admin: results (big cards + tap popup) --- */
let rRound='all';
function admResults(){
  if(!T.ko||!T.ko.length)return `<div class="panel" style="background:none;border:0;box-shadow:none;padding:6px 2px"><p class="hint">Bracket belum diundi. Buat undian dulu di tab Undian.</p></div>`;
  const rounds=koRounds().concat(T.ko.some(m=>m.round==='TP')?['TP']:[]);
  if(rRound!=='all'&&!rounds.includes(rRound))rRound='all';
  let h=`<p class="hint" style="margin:2px 2px 10px">Ketuk mana-mana kad perlawanan untuk isi keputusan — pilih nombor 0–5 untuk kedua-dua pasukan, kemudian tetapkan status.</p>`;
  h+=`<div class="chips mc-chips"><button class="chip${rRound==='all'?' active':''}" data-rr="all">Semua</button>`+
    rounds.map(r=>`<button class="chip${rRound===r?' active':''}" data-rr="${r}">${KOCAT[r]||KOLABEL[r]}</button>`).join('')+`</div>`;
  const show=rRound==='all'?rounds:[rRound];
  show.forEach(r=>{ const rows=T.ko.filter(m=>m.round===r); if(!rows.length)return;
    const done=rows.filter(matchDone).length;
    h+=`<div class="fx-group"><span class="fx-gk">${KOLABEL[r]}</span><span class="fx-gn">${done}/${rows.length} selesai</span></div>`;
    rows.forEach(m=>h+=matchCardBig(m,true));
  });
  return h;
}
function bindResults(){
  const c=$('#tab-admin');
  c.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{rRound=b.dataset.rr;renderAdmin();});
  c.querySelectorAll('.mcard.tapp[data-score]').forEach(el=>el.onclick=()=>openScore(el.dataset.score));
}
/* score picker modal */
let activeScore=null;
function openScore(mid){ activeScore=mid; buildScoreBody(); const m=$('#scoreModal'); if(m)m.hidden=false; }
function scRow(side,val,code){
  const t=team(code); const nm=t?tName(t):(code==='BYE'?'BYE':'TBD');
  const mk=t?(t.logo?`<span class="sm-logo" style="background-image:url('${imgSrc(t.logo)}')"></span>`:`<span class="sm-logo" style="background:${t.color};color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:10px">${esc(tShort(t))}</span>`):'';
  let btns=''; for(let n=0;n<=5;n++)btns+=`<button class="sm-num${val===n?' on':''}" data-side="${side}" data-n="${n}">${n}</button>`;
  return `<div class="sm-row"><div class="sm-team">${mk}<span class="sm-nm">${esc(nm)}</span></div><div class="sm-nums">${btns}</div></div>`;
}
function buildScoreBody(){
  const m=T.ko.find(x=>x.id===activeScore); if(!m)return;
  const tie=m.ts!=null&&m.bs!=null&&m.ts===m.bs;
  let h=scRow('ts',m.ts,m.top)+scRow('bs',m.bs,m.bot);
  if(tie){ h+=`<div class="sm-pen-lbl">Seri — penalti (pilihan)</div>`+scRow('pts',m.pts,m.top)+scRow('pbs',m.pbs,m.bot); }
  h+=`<div class="sm-actions sm-st3">
    <button class="btn ghost sm-st${m.status==='sched'?' on':''}" data-st="sched">Akan Datang</button>
    <button class="btn ghost sm-st${m.status==='live'?' on liveon':''}" data-st="live">🔴 Sedang</button>
    <button class="btn ghost sm-st${m.status==='ft'?' on':''}" data-st="ft">Selesai</button></div>`;
  h+=`<div class="sm-actions sm-act2">
    <button class="btn danger sm-reset">↺ Reset</button>
    <button class="btn sm-save">✓ Simpan</button></div>`;
  $('#scoreTitle').innerHTML=`Keputusan · <span style="color:var(--mint)">${koNo(m)}</span> · ${esc(KOLABEL[m.round]||'')}`;
  $('#scoreBody').innerHTML=h;
  $('#scoreBody').querySelectorAll('.sm-num').forEach(b=>b.onclick=()=>{ const m2=T.ko.find(x=>x.id===activeScore); if(!m2)return;
    m2[b.dataset.side]=+b.dataset.n; propagateKO(); save(); buildScoreBody(); renderPublic(); });
  $('#scoreBody').querySelectorAll('.sm-st').forEach(b=>b.onclick=()=>{ const m2=T.ko.find(x=>x.id===activeScore); if(!m2)return;
    m2.status=b.dataset.st; propagateKO(); save(); syncBattleToLive(); buildScoreBody(); renderPublic(); });
  const rb=$('#scoreBody').querySelector('.sm-reset'); if(rb)rb.onclick=()=>{ const m2=T.ko.find(x=>x.id===activeScore); if(!m2)return;
    m2.ts=null; m2.bs=null; m2.pts=null; m2.pbs=null; m2.status='sched'; propagateKO(); save(); buildScoreBody(); renderPublic(); renderAdmin(); toast('Keputusan direset'); };
  const sb=$('#scoreBody').querySelector('.sm-save'); if(sb)sb.onclick=()=>{ propagateKO(); save(); syncBattleToLive(); renderPublic(); renderAdmin(); $('#scoreModal').hidden=true; toast('Keputusan disimpan'); };
}

/* --- admin: voting (undi juri battle) --- */
function admVoting(){
  const L=liveLabels(), js=liveJudges(), t=liveTally(), S=battleSides();
  const banner=S.match
    ? `<div class="vbattle live">🔴 Battle LIVE (${koNo(S.match)}): <b>${esc(S.red.label)}</b> <span>Merah</span> lwn <b>${esc(S.green.label)}</b> <span>Hijau</span> — nama pihak ikut match ini automatik.</div>`
    : `<div class="vbattle">Tiada match <b>LIVE</b>. Tetapkan satu match ke <b>🔴 Sedang</b> di <b>Keputusan</b> supaya nama pihak Merah/Hijau ikut pasukan yang bertanding automatik. (Atau taip nama pihak sendiri di bawah.)</div>`;
  let h=`<div class="panel"><h2>Undi Juri (Battle)</h2>
    <p class="hint">Setiap juri buka <b>link sendiri</b> di telefon/tablet untuk mengundi <b style="color:#e11">Merah</b> / <b style="color:#159a52">Hijau</b>. Guna butang <b>Aktif</b> untuk buka atau kunci undi setiap juri. Paparan keluar di <b>OBS → Undi Juri</b>.</p>
    ${banner}
    <div class="row3"><div class="field"><label>Nama pihak Merah</label><input type="text" id="vRed" value="${esc(L.red)}"></div>
      <div class="field"><label>Nama pihak Hijau</label><input type="text" id="vGreen" value="${esc(L.green)}"></div></div>
    <div class="vote-tally"><span class="vt red">${esc(L.red)} · ${t.r}</span><span class="vt green">${esc(L.green)} · ${t.g}</span></div>
    <div class="btn-row" style="margin-bottom:4px"><button class="btn sm" id="vAllOn">🔓 Buka semua</button><button class="btn ghost sm" id="vAllOff">🔒 Kunci semua</button><button class="btn danger sm" id="vReset">↺ Reset undi</button></div>`;
  js.forEach(j=>{
    h+=`<div class="vjudge${j.active?'':' locked'}">
      <div class="vj-top"><span class="vj-no">${j.i+1}</span><input type="text" class="vj-name" data-vjn="${j.i}" value="${esc(j.name)}" placeholder="Nama juri ${j.i+1}">
        <button class="vj-active${j.active?' on':''}" data-vja="${j.i}">${j.active?'● Aktif':'○ Kunci'}</button></div>
      <div class="vj-pick"><button class="vbtn red${j.vote==='red'?' on':''}" data-vj="${j.i}" data-vv="red">🔴 Merah</button>
        <button class="vbtn green${j.vote==='green'?' on':''}" data-vj="${j.i}" data-vv="green">🟢 Hijau</button>
        <button class="vbtn clr${!j.vote?' on':''}" data-vj="${j.i}" data-vv="">✕</button></div>
      <div class="vj-link"><input type="text" class="vj-url" readonly value="${esc(judgeLink(j.i))}"><button class="btn ghost sm vj-copy" data-vjc="${j.i}">📋 Salin</button></div></div>`;
  });
  h+=`</div>`;
  return h;

  const gl=$('#vGreen'); if(gl)gl.oninput=()=>{ liveSet({yl:gl.value}); soft(); };
  c.querySelectorAll('.vbtn[data-vj]').forEach(b=>b.onclick=async()=>{ await liveSet({['v'+(+b.dataset.vj)]:b.dataset.vv||null}); renderAdmin(); renderPublic(); });

  const off=$('#vAllOff'); if(off)off.onclick=async()=>{ const p={}; for(let i=0;i<NJUDGES;i++)p['a'+i]=false; await liveSet(p); renderAdmin(); renderPublic(); toast('Semua juri dikunci'); };
  const rb=$('#vReset'); if(rb)rb.onclick=async()=>{ const p={}; for(let i=0;i<NJUDGES;i++)p['v'+i]=null; await liveSet(p); renderAdmin(); renderPublic(); toast('Undi juri direset'); };

/* halaman juri (peranti juri sendiri, ?juri=N) */
function judgeSideHTML(side){
  const name=side==='r'?(LV.rl||'Merah'):(LV.yl||'Hijau');
  const logo=side==='r'?LV.rlogo:LV.ylogo, flag=side==='r'?LV.rflag:LV.yflag, color=side==='r'?LV.rcolor:LV.ycolor;
  const mk=logo?`<span class="jp-logo" style="background-image:url('${imgSrc(logo)}')"></span>`:(color?`<span class="jp-dot" style="background:${color}"></span>`:'');
  const fl=flag?`<img class="jp-flag" src="${imgSrc(flag)}" alt="">`:'';
  return `${(mk||fl)?`<span class="jp-mark">${mk}${fl}</span>`:''}<span class="jp-tn">${esc(name)}</span>`;
}
function renderJudgePage(idx){
  const tb=document.querySelector('.topbar'); if(tb)tb.style.display='none';
  const tabs=document.getElementById('tabs'); if(tabs)tabs.style.display='none';
  const wrap=document.querySelector('.wrap'); if(wrap)wrap.style.display='none';
  let s=document.getElementById('judgeScreen');
  if(!s){ s=document.createElement('div'); s.id='judgeScreen'; document.body.appendChild(s); }
  const L=liveLabels(), j=liveJudges()[idx], active=j.active;
  s.innerHTML=`<div class="jp">
    <div class="jp-tag">Undi Juri ${idx+1}</div>
    <div class="jp-name">${esc(j.name)}</div>
    <div class="jp-sub">${active?'Ketuk undi anda':'⏳ Menunggu admin membuka undian…'}</div>
    <div class="jp-btns">
      <button class="jp-btn red${j.vote==='red'?' on':''}" data-v="red"${active?'':' disabled'}>${judgeSideHTML('r')}</button>
      <button class="jp-btn green${j.vote==='green'?' on':''}" data-v="green"${active?'':' disabled'}>${judgeSideHTML('y')}</button>
    </div>

function handleUpload(file){
  if(!file||!activeUpload)return; const t=team(activeUpload); if(!t)return;

    const sc=Math.max(S/img.width,S/img.height),w=img.width*sc,h=img.height*sc;ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
    t.logo=cn.toDataURL('image/jpeg',0.78);
    const b=document.querySelector('.tlogo[data-tlogo="'+CSS.escape(t.id)+'"]'); if(b){b.style.backgroundImage='url("'+t.logo+'")';b.classList.add('has');}
    const lu=document.querySelector('input[data-tlogourl="'+CSS.escape(t.id)+'"]'); if(lu)lu.value='';

    if(!LV||!Object.keys(LV).length){ if(_fbLive&&window.__FB.getLive){ const cur=await window.__FB.getLive(); LV=(cur&&Object.keys(cur).length)?cur:liveDefaults(); } else LV=liveDefaults(); }
    renderJudgePage(_juri); cloudBadge(_fbLive); return;

  // ---- Sediakan undi juri (admin/utama) ----
  if(!isViewOnly()){

    else if(!Object.keys(LV).length){ LV=liveDefaults(); liveSaveLocal(); }

  if(!T.adminPass)T.adminPass=T.pin||'1234';
  if(!T.dance||!T.dance.s1){ T.dance={title:'Tarian Kreatif Borneo',s1:{name:'Sesi 1',date:'26-09-2026 (Sabtu)',time:'2.00 Petang',teams:Array(15).fill('')},s2:{name:'Sesi 2',date:'26-09-2026 (Sabtu)',time:'7.00 Malam',teams:Array(15).fill('')}}; }
  [T.dance.s1,T.dance.s2].forEach(s=>{ if(!Array.isArray(s.teams))s.teams=[]; while(s.teams.length<15)s.teams.push(''); });
  T.teams.forEach(t=>{ if(!Array.isArray(t.ach))t.ach=[];
    if(t.flagName){ const f=STATES.find(x=>x[0]===t.flagName); if(f)t.flag=flagURL(f[1]); } });
  const before=fresh?'':JSON.stringify(T);
  if(T.ko.length)propagateKO();
  const changed=fresh||JSON.stringify(T)!==before||(_fbLive&&!_fromCloud);
  _lastSync=JSON.stringify(T);
  if(changed && !isViewOnly()) await save();     // muat naik data tempatan/baru ke awan kosong; elak tindih bila tak berubah
  applyBrand(); init(); renderPublic();
  syncBattleToLive();
  cloudBadge(_fbLive);
  if(_fbLive&&window.__FB&&window.__FB.sub){ try{ window.__FB.sub(applyRemote); }catch(e){ console.warn('sub fail',e); } }
})();
